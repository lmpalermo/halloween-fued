<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halloween Feud</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#140d20;color:#fff5e9;font-family:system-ui,sans-serif}main{max-width:1000px;margin:auto}h1{text-align:center;color:#ff9a3c;font-size:2.5rem}.scores,.controls{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:20px 0}.team{flex:1;min-width:220px;padding:18px;border:2px solid #64477c;border-radius:16px;text-align:center;background:#251737}.team.active{border-color:#ff9a3c}.team input{width:100%;background:transparent;color:white;border:0;text-align:center;font:inherit}.score{font-size:2.6rem;font-weight:bold}#question{text-align:center;font-size:1.7rem}#status,#round,#bank,#strikes{text-align:center}#bank{font-size:1.4rem}#strikes{color:#ff6464;font-size:2rem;min-height:48px}#board{display:grid;gap:10px}button{padding:12px 18px;border:0;border-radius:10px;background:#ff9a3c;color:#241329;font:inherit;font-weight:bold;cursor:pointer}button:disabled{opacity:.45;cursor:default}.answer{display:flex;justify-content:space-between;background:#392451;color:white;min-height:62px;font-size:1.3rem;border:1px solid #64477c}.answer.revealed{background:#235246;border-color:#83d4b7}.answer:disabled{opacity:1}.danger{background:#ff6464}details{margin-top:24px;padding:14px;border:1px solid #64477c;border-radius:10px}summary{cursor:pointer}#key{line-height:1.9}.hint{color:#cbb9d9;text-align:center;font-size:.9rem}#syncStatus{text-align:center;font-weight:700;margin:8px 0;color:#83d4b7}#timerStatus{text-align:center;font-size:1.25rem;font-weight:800;min-height:30px}.timer-running{background:#83d4b7!important}.timer-stop{background:#ff6464!important}
.tv-mode .hint{display:none}.tv-mode body{padding:18px}.tv-mode main{max-width:1200px}
.tv-mode h1{font-size:3rem;margin:.3em 0}.tv-mode #question{font-size:2.1rem}
.tv-mode .answer{min-height:72px;font-size:1.6rem}.tv-mode .score{font-size:3.2rem}
.tv-mode .team input{pointer-events:none}
#modeChooser{position:fixed;inset:0;z-index:9999;background:#140d20;display:none;align-items:center;justify-content:center;padding:24px}
#modeChooser .chooser-card{width:min(680px,100%);background:#251737;border:2px solid #64477c;border-radius:22px;padding:28px;text-align:center}
#modeChooser h1{margin-top:0}
.mode-button{display:block;text-decoration:none;margin:18px 0;padding:24px;border-radius:16px;background:#ff9a3c;color:#241329;font-size:1.5rem;font-weight:800}
.mode-button.tv{background:#fff5e9}
body.choose-mode #modeChooser{display:flex}
body.choose-mode main{display:none}
</style>
</head>
<body>
<div id="modeChooser">
  <div class="chooser-card">
    <h1>🎃 Halloween Feud</h1>
    <p>Choose how this device will be used.</p>
    <a class="mode-button" href="?mode=host">🎮 HOST CONTROLLER</a>
    <a class="mode-button tv" href="tv.html">📺 TV DISPLAY</a>
  </div>
</div>
<main>
<h1>🎃 Halloween Feud</h1>
<div class="scores">
<div class="team" id="team0"><input id="name0" value="Team Ghosts" aria-label="Team one name"><div class="score" id="score0">0</div></div>
<div class="team" id="team1"><input id="name1" value="Team Pumpkins" aria-label="Team two name"><div class="score" id="score1">0</div></div>
</div>
<p id="round"></p><h2 id="question"></h2><p id="bank"></p><div id="strikes" aria-label="Strikes"></div><p id="status" aria-live="polite"></p><div id="board"></div>
<div class="controls">
<button id="switch">Switch controlling team</button><button id="strike" class="danger">❌ Strike</button><button id="award">Award round</button><button id="failed">Steal failed</button><button id="next">Next round →</button><button id="undo">Undo</button><button id="timer">🎵 15-Second Timer</button><button id="fullscreen">Fullscreen</button><button id="reset">New game</button>
</div>
<p id="timerStatus"></p><p id="syncStatus">Firebase: connecting…</p>
<p class="hint">Click a numbered answer when a player guesses it. Change team names by clicking them.</p>
<details id="hostKey"><summary>Host answer key — opening this exposes the answers</summary><ol id="key"></ol></details>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAmFE08f79oyGbenEQHHB0pRGFBO4Y-xkQ",
  authDomain: "halloween-fued.firebaseapp.com",
  databaseURL: "https://halloween-fued-default-rtdb.firebaseio.com",
  projectId: "halloween-fued",
  storageBucket: "halloween-fued.firebasestorage.app",
  messagingSenderId: "115514988678",
  appId: "1:115514988678:web:ed6f21b8980d34363f9907"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let mode = new URLSearchParams(location.search).get("mode");
if (!["host","tv"].includes(mode)) {
  mode = null;
  document.body.classList.add("choose-mode");
}
const ROOM = "party";
const gameRef = db.ref("games/" + ROOM);
const timerRef = db.ref("games/" + ROOM + "/timer");
let applyingRemote = false;
// Edit your questions here. These are fictional scores, not real survey results.
const QUESTIONS = [
  {
    "question": "Name something that gets scarier the older you get.",
    "answers": [
      ["Getting older / birthdays", 28],
      ["Bills / money", 22],
      ["Doctors / health", 18],
      ["The mirror", 14],
      ["Hangovers", 10],
      ["Teenagers / kids", 8]
    ]
  },
  {
    "question": "Name something you might regret doing at a Halloween party.",
    "answers": [
      ["Drinking too much", 30],
      ["Texting an ex", 20],
      ["Bad dancing", 16],
      ["Kissing someone", 14],
      ["Posting pictures", 12],
      ["Wearing THAT costume", 8]
    ]
  },
  {
    "question": "Name something people think they're really good at after a few drinks.",
    "answers": [
      ["Dancing", 28],
      ["Singing", 22],
      ["Flirting", 18],
      ["Telling stories", 14],
      ["Giving advice", 10],
      ["Texting", 8]
    ]
  },
  {
    "question": "Name something embarrassing that could happen while wearing a Halloween costume.",
    "answers": [
      ["Costume rips", 26],
      ["Trip / fall", 22],
      ["Wardrobe malfunction", 18],
      ["Can't use the bathroom", 14],
      ["Lose part of the costume", 12],
      ["Someone wears the same costume", 8]
    ]
  },
  {
    "question": "Name a costume you'd question if your spouse said, ‘Don't worry, it's totally appropriate.’",
    "answers": [
      ["Sexy nurse", 24],
      ["Playboy bunny", 20],
      ["Stripper", 18],
      ["French maid", 16],
      ["Tarzan / Jane", 12],
      ["Anything with body paint", 10]
    ]
  },
  {
    "question": "Name something you might hear yelled at an adult Halloween party.",
    "answers": [
      ["Shots!", 28],
      ["Turn it up!", 20],
      ["Where's my drink?", 18],
      ["Take a picture!", 14],
      ["Who invited them?", 12],
      ["I need an Uber!", 8]
    ]
  },
  {
    "question": "Besides candy, name something adults hope to get on Halloween night.",
    "answers": [
      ["Drinks", 26],
      ["Get lucky", 22],
      ["A kiss", 18],
      ["Attention", 14],
      ["Food", 12],
      ["A phone number", 8]
    ]
  },
  {
    "question": "Name something that could make you say, ‘I'm NEVER drinking that again!’",
    "answers": [
      ["Tequila", 28],
      ["Fireball", 22],
      ["Mystery punch", 18],
      ["Shots", 14],
      ["Too much wine", 10],
      ["Jell-O shots", 8]
    ]
  }
];
const $=id=>document.getElementById(id);
let history=[],state=initialState();
let publishChain=Promise.resolve();
let timerHandle=null,timerEndsAt=0,audioCtx=null,musicHandle=null;
function initialState(){return {round:0,scores:[0,0],controller:0,strikes:0,revealed:[],bank:0,phase:"play",winner:null};}
function remember(){history.push(JSON.stringify(state));}
function teamName(index){return $("name"+index).value.trim()||`Team ${index+1}`;}
function settle(winner){state.scores[winner]+=state.bank;state.winner=winner;state.phase="settled";}
function setSync(text,bad=false){if($("syncStatus")){ $("syncStatus").textContent=text; $("syncStatus").style.color=bad?"#ff6464":"#83d4b7"; }}
function publish(){
  if(mode!=="host" || applyingRemote) return Promise.resolve();
  const payload={state:JSON.parse(JSON.stringify(state)),names:[$("name0").value,$("name1").value],updatedAt:firebase.database.ServerValue.TIMESTAMP};
  setSync("Firebase: saving…");
  publishChain=publishChain.then(()=>gameRef.update(payload)).then(()=>setSync("Firebase: synced ✓")).catch(err=>{setSync("Firebase: sync error",true);console.error(err);});
  return publishChain;
}
function commit(){render();publish();}
function reveal(index){
  if(state.phase==="settled"||state.revealed.includes(index))return;
  remember();state.revealed.push(index);state.bank+=QUESTIONS[state.round].answers[index][1];
  if(state.phase==="steal")settle(1-state.controller);
  else if(state.revealed.length===QUESTIONS[state.round].answers.length)settle(state.controller);
  commit();
}
function render(){
  const q=QUESTIONS[state.round],playing=state.phase==="play",stealing=state.phase==="steal",settled=state.phase==="settled";
  const active=settled?state.winner:stealing?1-state.controller:state.controller;
  for(let i=0;i<2;i++){$("score"+i).textContent=state.scores[i];$("team"+i).classList.toggle("active",active===i);}
  $("round").textContent=`Round ${state.round+1} of ${QUESTIONS.length}`;
  $("question").textContent=q.question;$("bank").textContent=`Round points: ${state.bank}`;$("strikes").textContent="❌ ".repeat(state.strikes);
  if(settled){let message=`${teamName(state.winner)} wins ${state.bank} points!`;if(state.round===QUESTIONS.length-1){const[a,b]=state.scores;message+=a===b?" The game ends in a tie!":` ${teamName(a>b?0:1)} wins the game!`;}$('status').textContent=message;}
  else if(stealing)$('status').textContent=`${teamName(active)}: one guess to steal! Reveal a correct answer, or click “Steal failed.”`;
  else $('status').textContent=`${teamName(active)} is playing.`;
  $('board').replaceChildren();
  q.answers.forEach(([answer,points],index)=>{const shown=state.revealed.includes(index),button=document.createElement('button');button.className='answer'+(shown?' revealed':'');button.disabled=shown||settled;button.setAttribute('aria-label',shown?`${answer}, ${points} points`:`Reveal answer ${index+1}`);const text=document.createElement('span'),score=document.createElement('span');text.textContent=shown?answer:`Answer ${index+1}`;score.textContent=shown?points:'🎃';button.append(text,score);button.onclick=()=>reveal(index);$('board').append(button);});
  $('key').replaceChildren();q.answers.forEach(([answer,points])=>{const item=document.createElement('li');item.textContent=`${answer} — ${points}`;$('key').append(item);});
  $('switch').disabled=!playing;$('strike').disabled=!playing;$('award').disabled=!playing;$('failed').disabled=!stealing;$('next').disabled=!settled||state.round===QUESTIONS.length-1;$('undo').disabled=history.length===0;
}
$('switch').onclick=()=>{remember();state.controller=1-state.controller;commit();};
$('strike').onclick=()=>{remember();state.strikes++;if(state.strikes>=3)state.phase='steal';commit();};
$('award').onclick=()=>{remember();settle(state.controller);commit();};
$('failed').onclick=()=>{remember();settle(state.controller);commit();};
$('next').onclick=()=>{remember();state.round++;state.controller=state.round%2;state.strikes=0;state.revealed=[];state.bank=0;state.phase='play';state.winner=null;$('hostKey').open=false;commit();};
$('undo').onclick=()=>{if(history.length){state=JSON.parse(history.pop());commit();}};
$('reset').onclick=()=>{if(!confirm('Start a new game and clear both scores?'))return;remember();state=initialState();$('hostKey').open=false;commit();};
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{alert('Fullscreen is unavailable. Use your browser’s fullscreen command.');}};
let nameTimer=null;
function nameChanged(){render();clearTimeout(nameTimer);nameTimer=setTimeout(publish,250);}
$('name0').oninput=nameChanged;$('name1').oninput=nameChanged;

function stopTimerLocal(message){
  clearInterval(timerHandle);timerHandle=null;timerEndsAt=0;
  $('timer').textContent='🎵 15-Second Timer';$('timer').classList.remove('timer-stop','timer-running');
  $('timerStatus').textContent=message||'';
}
function sendTimer(status){
  const now=Date.now();
  const data={status:status,commandId:now,startedAt:now,endsAt:status==='running'?now+15000:0};
  return timerRef.set(data).catch(err=>{setSync('Firebase: timer sync error',true);console.error(err);});
}
function startTimer(){
  if(timerHandle){stopTimerLocal('Timer stopped');sendTimer('stopped');return;}
  timerEndsAt=Date.now()+15000;
  $('timer').textContent='⏹ Stop Timer';$('timer').classList.add('timer-stop');
  sendTimer('running');
  const tick=()=>{
    const left=Math.max(0,Math.ceil((timerEndsAt-Date.now())/1000));
    $('timerStatus').textContent=left?`⏱️ ${left} seconds — sound is playing on TV`:'😱 TIME!';
    if(left<=0){clearInterval(timerHandle);timerHandle=null;timerEndsAt=0;$('timer').textContent='🎵 15-Second Timer';$('timer').classList.remove('timer-stop');}
  };
  tick();timerHandle=setInterval(tick,200);
}
$('timer').onclick=startTimer;

const originalRender=render;
render=function(){originalRender();document.body.classList.toggle('tv-mode',mode==='tv');if(mode==='tv'){$('hostKey').style.display='none';document.querySelector('.controls').style.display='none';$('timerStatus').style.display='none';$('syncStatus').style.display='none';$('name0').disabled=true;$('name1').disabled=true;}};

render();
if(mode==='host'){
  setSync('Firebase: loading…');
  gameRef.once('value').then(s=>{applyingRemote=true;if(s.exists()){const v=s.val();if(v.state)state=v.state;if(v.names){$('name0').value=v.names[0]||'Team Ghosts';$('name1').value=v.names[1]||'Team Pumpkins';}}applyingRemote=false;render();setSync('Firebase: connected ✓');if(!s.exists())publish();}).catch(err=>{setSync('Firebase: connection error',true);console.error(err);});
}else if(mode==='tv'){
  gameRef.on('value',s=>{if(!s.exists())return;const v=s.val();applyingRemote=true;if(v.state)state=v.state;if(v.names){$('name0').value=v.names[0]||'Team Ghosts';$('name1').value=v.names[1]||'Team Pumpkins';}render();applyingRemote=false;});
}
</script></body></html>
