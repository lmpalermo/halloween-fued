const $=id=>document.getElementById(id);
let history=[],state;
function initialState(){return {round:0,scores:[0,0],controller:0,strikes:0,revealed:[],bank:0,phase:"play",winner:null};}
function remember(){history.push(JSON.stringify(state));}
function teamName(index){return $("name"+index).value.trim()||`Team ${index+1}`;}
function settle(winner){state.scores[winner]+=state.bank;state.winner=winner;state.phase="settled";}
function reveal(index){
if(state.phase==="settled"||state.revealed.includes(index))return;
remember();state.revealed.push(index);state.bank+=QUESTIONS[state.round].answers[index][1];
if(state.phase==="steal")settle(1-state.controller);
else if(state.revealed.length===QUESTIONS[state.round].answers.length)settle(state.controller);
render();publish();
}
function render(){
const q=QUESTIONS[state.round],playing=state.phase==="play",stealing=state.phase==="steal",settled=state.phase==="settled";
const active=settled?state.winner:stealing?1-state.controller:state.controller;
for(let i=0;i<2;i++){$("score"+i).textContent=state.scores[i];$("team"+i).classList.toggle("active",active===i);}
$("round").textContent=`Round ${state.round+1} of ${QUESTIONS.length}`;
$("question").textContent=q.question;$("bank").textContent=`Round points: ${state.bank}`;$("strikes").textContent="❌ ".repeat(state.strikes);
if(settled){let message=`${teamName(state.winner)} wins ${state.bank} points!`;if(state.round===QUESTIONS.length-1){const[a,b]=state.scores;message+=a===b?" The game ends in a tie!":` ${teamName(a>b?0:1)} wins the game!`;}$("status").textContent=message;}
else if(stealing)$("status").textContent=`${teamName(active)}: one guess to steal! Reveal a correct answer, or click “Steal failed.”`;
else $("status").textContent=`${teamName(active)} is playing.`;
$("board").replaceChildren();
q.answers.forEach(([answer,points],index)=>{const shown=state.revealed.includes(index),button=document.createElement("button");button.className="answer"+(shown?" revealed":"");button.disabled=shown||settled;button.setAttribute("aria-label",shown?`${answer}, ${points} points`:`Reveal answer ${index+1}`);const text=document.createElement("span"),score=document.createElement("span");text.textContent=shown?answer:`Answer ${index+1}`;score.textContent=shown?points:"🎃";button.append(text,score);button.onclick=()=>reveal(index);$("board").append(button);});
$("key").replaceChildren();q.answers.forEach(([answer,points])=>{const item=document.createElement("li");item.textContent=`${answer} — ${points}`;$("key").append(item);});
$("switch").disabled=!playing;$("strike").disabled=!playing;$("award").disabled=!playing;$("failed").disabled=!stealing;$("next").disabled=!settled||state.round===QUESTIONS.length-1;$("undo").disabled=history.length===0;
}
$("switch").onclick=()=>{remember();state.controller=1-state.controller;render();publish();};
$("strike").onclick=()=>{remember();state.strikes++;if(state.strikes===3)state.phase="steal";render();publish();};
$("award").onclick=()=>{remember();settle(state.controller);render();publish();};
$("failed").onclick=()=>{remember();settle(state.controller);render();publish();};
$("next").onclick=()=>{remember();state.round++;state.controller=state.round%2;state.strikes=0;state.revealed=[];state.bank=0;state.phase="play";state.winner=null;$("hostKey").open=false;render();publish();};
$("undo").onclick=()=>{if(history.length){state=JSON.parse(history.pop());render();publish();}};
$("reset").onclick=()=>{if(!confirm("Start a new game and clear both scores?"))return;remember();state=initialState();$("hostKey").open=false;render();publish();};
$("fullscreen").onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{alert("Fullscreen is unavailable. Use your browser’s fullscreen command.");}};
$("name0").oninput=()=>{render();publish();};$("name1").oninput=()=>{render();publish();};

let timerInterval=null, timerTimeout=null, audioCtx=null, musicNodes=[];
function getAudioCtx(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended") audioCtx.resume();
  return audioCtx;
}
function spookyNote(freq,start,duration,volume=.07){
  const ctx=getAudioCtx(), osc=ctx.createOscillator(), gain=ctx.createGain();
  osc.type="triangle"; osc.frequency.setValueAtTime(freq,start);
  gain.gain.setValueAtTime(0.0001,start); gain.gain.exponentialRampToValueAtTime(volume,start+.03);
  gain.gain.exponentialRampToValueAtTime(0.0001,start+duration);
  osc.connect(gain); gain.connect(ctx.destination); osc.start(start); osc.stop(start+duration+.05);
  musicNodes.push(osc);
}
function startSpookyMusic(){
  const ctx=getAudioCtx(), now=ctx.currentTime+.03;
  const notes=[220,261.63,233.08,196,174.61,207.65,185,164.81];
  for(let i=0;i<30;i++) spookyNote(notes[i%notes.length],now+i*.5,.42,.055);
}
function scream(){
  const ctx=getAudioCtx(), now=ctx.currentTime, osc=ctx.createOscillator(), gain=ctx.createGain();
  osc.type="sawtooth"; osc.frequency.setValueAtTime(900,now); osc.frequency.exponentialRampToValueAtTime(240,now+1.25);
  gain.gain.setValueAtTime(.0001,now); gain.gain.exponentialRampToValueAtTime(.22,now+.04); gain.gain.exponentialRampToValueAtTime(.0001,now+1.3);
  const wob=ctx.createOscillator(), wobGain=ctx.createGain(); wob.frequency.value=18; wobGain.gain.value=70; wob.connect(wobGain); wobGain.connect(osc.frequency);
  osc.connect(gain); gain.connect(ctx.destination); wob.start(now); osc.start(now); wob.stop(now+1.3); osc.stop(now+1.3);
}
function stopTimer(){
  clearInterval(timerInterval); clearTimeout(timerTimeout); timerInterval=timerTimeout=null;
  musicNodes.forEach(n=>{try{n.stop()}catch(e){}}); musicNodes=[];
  $("timerBtn").textContent="🎵 15-Second Timer"; $("timerBtn").classList.remove("running"); $("timerDisplay").textContent="";
}
function startTimer(){
  if(timerTimeout){ stopTimer(); return; }
  getAudioCtx(); startSpookyMusic();
  let left=15; $("timerDisplay").textContent=left+"s"; $("timerBtn").textContent="⏹ Stop Timer"; $("timerBtn").classList.add("running");
  timerInterval=setInterval(()=>{left--; $("timerDisplay").textContent=Math.max(0,left)+"s";},1000);
  timerTimeout=setTimeout(()=>{ clearInterval(timerInterval); timerInterval=timerTimeout=null; musicNodes=[]; $("timerDisplay").textContent="0s"; scream(); $("timerBtn").textContent="🎵 15-Second Timer"; $("timerBtn").classList.remove("running"); setTimeout(()=>{$("timerDisplay").textContent="";},1500); },15000);
}
$("timerBtn").onclick=startTimer;

async function publish(){
  if(mode!=="host" || applyingRemote) return;
  await gameRef.set({
    state: state,
    names: [$("name0").value, $("name1").value],
    updatedAt: firebase.database.ServerValue.TIMESTAMP
  });
}

const originalRender = render;
render = function(){
  originalRender();
  document.body.classList.toggle("tv-mode", mode==="tv");
  if(mode==="tv"){
    $("hostKey").style.display="none";
    document.querySelector(".controls").style.display="none";
    $("name0").disabled=true; $("name1").disabled=true;
  }
};

if(mode==="host"){
  gameRef.once("value").then(s=>{
    if(!s.exists()){ state=initialState(); render(); publish(); }
    else {
      const v=s.val(); applyingRemote=true;
      if(v.state) state=v.state;
      if(v.names){ $("name0").value=v.names[0]||"Team Ghosts"; $("name1").value=v.names[1]||"Team Pumpkins"; }
      render(); applyingRemote=false;
    }
  });
} else if(mode==="tv") {
  gameRef.on("value", s=>{
    if(!s.exists()) return;
    const v=s.val(); applyingRemote=true;
    if(v.state) state=v.state;
    if(v.names){ $("name0").value=v.names[0]||"Team Ghosts"; $("name1").value=v.names[1]||"Team Pumpkins"; }
    render(); applyingRemote=false;
  });
}
state=initialState();render();
</script></body></html>
