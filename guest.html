<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Halloween Game Controller</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#321442,#0d0712 70%);color:#fff6e9;font-family:system-ui;text-align:center;padding:18px}.card{max-width:520px;margin:auto;background:#251737;border:3px solid #ff9a3c;border-radius:24px;padding:22px}h1{color:#ff9a3c}input,select{font-size:1.35rem;padding:12px;border-radius:12px;width:100%;margin:7px 0}button{width:100%;padding:18px;margin:8px 0;border:0;border-radius:16px;font-size:1.25rem;font-weight:900;background:#ff9a3c;color:#241329}.team{display:grid;grid-template-columns:1fr 1fr;gap:10px}.team button{min-height:100px}#buzz{font-size:clamp(2.5rem,13vw,5rem);min-height:240px;background:#e53935;color:white;box-shadow:0 0 35px #e5393588}#spin{font-size:2rem;min-height:150px;background:#9b5de5;color:white}.ghost{background:#7f67d9!important;color:white!important}.pumpkin{background:#ff922b!important}.hidden{display:none}#status{font-size:1.35rem;font-weight:800;min-height:3em}small{opacity:.8}</style></head><body><div class="card"><h1>👻 Sanders' Halloween Bash 🎃</h1>
<div id="join"><select id="game"><option value="jeopardy">💀 Jeopardy</option><option value="feud">🎤 Family Feud</option><option value="wheel">🎡 Wheel</option></select><input id="room" inputmode="numeric" maxlength="4" placeholder="4-digit game code"><h2>Pick your team</h2><div class="team"><button class="ghost" onclick="join(0)">👻<br>GHOSTS</button><button class="pumpkin" onclick="join(1)">🎃<br>PUMPKINS</button></div></div>
<div id="play" class="hidden"><h2 id="who"></h2><div id="status">Connecting…</div><button id="buzz" class="hidden" onclick="buzz()">BUZZ!</button><button id="spin" class="hidden" onclick="spin()">🎡 SPIN THE WHEEL</button><button onclick="leave()">Change Game / Team</button><small>Keep this page open while you play.</small></div></div>
<script>

const DB="https://halloween-fued-default-rtdb.firebaseio.com";
const clean=v=>String(v||"").replace(/\D/g,"").slice(0,4);
const code=()=>String(Math.floor(1000+Math.random()*9000));
async function req(path,method="GET",body,headers={}){
 const r=await fetch(DB+"/"+path+".json",{method,headers:{"Content-Type":"application/json",...headers},
 body:body===undefined?undefined:JSON.stringify(body),cache:"no-store"});
 if(!r.ok) throw Error("Firebase "+r.status);
 return r.json();
}
function hostCode(game){
 const qp=clean(new URLSearchParams(location.search).get("room"));
 let k="sanders:"+game+":host",c=qp||clean(sessionStorage.getItem(k));
 if(c.length!==4)c=code(); sessionStorage.setItem(k,c); return c;
}
function home(){location.href="../"}
function guestUrl(game,room){return location.origin+"/guest.html?game="+encodeURIComponent(game)+"&room="+room}
function qrUrl(game,room){return "https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data="+encodeURIComponent(guestUrl(game,room))}

let GAME="",ROOM="",TEAM=0,PATH="",lastReset=0,pollTimer=null;
const $=x=>document.getElementById(x);
const p=new URLSearchParams(location.search); if(p.get("game"))$("game").value=p.get("game"); if(clean(p.get("room")).length===4)$("room").value=clean(p.get("room"));
function leave(){clearTimeout(pollTimer);$("play").classList.add("hidden");$("join").classList.remove("hidden")}
function join(t){ROOM=clean($("room").value);if(ROOM.length!==4)return alert("Enter all 4 numbers.");GAME=$("game").value;TEAM=t;PATH=GAME==="feud"?"games/"+ROOM:"games/"+GAME+"/"+ROOM;$("who").textContent=(TEAM===0?"👻 Team Ghosts":"🎃 Team Pumpkins")+" • "+GAME.toUpperCase()+" • "+ROOM;$("join").classList.add("hidden");$("play").classList.remove("hidden");poll()}
async function atomicClaim(path,value){const u=DB+"/"+path+".json";const g=await fetch(u,{headers:{"X-Firebase-ETag":"true"},cache:"no-store"});const old=await g.json();if(old)return false;const et=g.headers.get("etag");const r=await fetch(u,{method:"PUT",headers:{"Content-Type":"application/json","if-match":et},body:JSON.stringify(value)});return r.ok}
async function buzz(){$("buzz").disabled=true;$("status").textContent="⚡ BUZZING…";try{const ok=await atomicClaim(PATH+"/phone/buzz",{team:TEAM,at:Date.now()});$("status").textContent=ok?"🎉 YOU BUZZED FIRST!":"👻 Too late — the other team got it!"}catch(e){$("status").textContent="Connection problem — try again."}}
async function spin(){$("spin").disabled=true;try{const id=Date.now();const ok=await atomicClaim(PATH+"/phone/spinRequest",{team:TEAM,id,at:id});$("status").textContent=ok?"🎡 Spin sent!":"🎃 A spin is already being handled."}catch(e){$("status").textContent="Connection problem — try again."}}
async function poll(){try{const v=await req(PATH);const ph=v?.phone||{};const bz=ph.buzz;const reset=ph.resetId||0;if(reset!==lastReset){lastReset=reset;$("buzz").disabled=false}let showBuzz=(GAME==="feud"||GAME==="jeopardy")&&ph.buzzEnabled!==false;let showSpin=GAME==="wheel"||ph.spinEnabled===true;$("buzz").classList.toggle("hidden",!showBuzz);$("spin").classList.toggle("hidden",!showSpin);if(showSpin){const active=GAME==="wheel"?v?.state?.active:ph.spinTeam;let canSpin=active===TEAM;if(GAME==="wheel"){const st=v?.state||{};canSpin=canSpin&&!st.bonus&&!st.solved&&st.phoneSpinAllowed!==false}$("spin").disabled=!canSpin;$("status").textContent=canSpin?"🎡 Your team can spin!":"⏳ Waiting for your team's turn…"}else if(bz){$("buzz").disabled=true;$("status").textContent=bz.team===TEAM?"🎉 YOUR TEAM BUZZED FIRST!":"👻 Other team buzzed first."}else{$("buzz").disabled=false;$("status").textContent="🚨 Ready to buzz!"}}catch(e){$("status").textContent="Reconnecting…"}finally{pollTimer=setTimeout(poll,650)}}
</script></body></html>
