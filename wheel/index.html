<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halloween Wheel</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#32135a,#0d0716 60%);color:#fff;font-family:Arial;text-align:center;min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:14px}h1{color:#ff922b}.code{color:#ffbf69;font-size:1.3rem;font-weight:900}.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}.team{padding:10px;border:3px solid #9258e8;border-radius:18px;background:#261346}.team.active{border-color:#ff9f1c}.score{font-size:30px;font-weight:bold}input{font-size:19px;width:80%;text-align:center}.puzzle{font-size:26px;letter-spacing:4px;margin:12px}.alpha{display:flex;flex-wrap:wrap;justify-content:center}.alpha button{width:46px}button{font-size:16px;padding:10px 13px;margin:4px;border:0;border-radius:11px;background:#ff9f1c;color:#24102f;font-weight:bold}.secondary{background:#9b5de5;color:white}</style></head><body><div class="wrap"><h1>🎡 Sanders' Halloween Wheel</h1><div class="code">GAME CODE: <span id="gc"></span></div><button onclick="home()">🏠 Game Night Home</button><div class="teams"><div id="t0" class="team"><input id="n0" value="Team Ghosts"><div class="score">$<span id="s0">0</span></div></div><div id="t1" class="team"><input id="n1" value="Team Pumpkins"><div class="score">$<span id="s1">0</span></div></div></div><h2 id="cat"></h2><div id="msg"></div><div id="puzzle" class="puzzle"></div><button onclick="spin()">🎡 SPIN</button><button class="secondary" onclick="solve()">Solve Puzzle</button><button onclick="pass()">Wrong / Pass Turn</button><div id="alpha" class="alpha"></div><button onclick="next()">Next Puzzle ➜</button><button onclick="newGame()">New Game</button></div><script>
const DB="https://halloween-fued-default-rtdb.firebaseio.com";
const code=()=>String(Math.floor(1000+Math.random()*9000));
const clean=v=>String(v||"").replace(/\D/g,"").slice(0,4);
async function req(path,method="GET",body){
 const r=await fetch(DB+"/"+path+".json",{method,headers:{"Content-Type":"application/json"},body:body===undefined?undefined:JSON.stringify(body),cache:"no-store"});
 if(!r.ok)throw Error("Firebase "+r.status); return r.json();
}
function hostCode(game){let k="sanders:"+game+":host",c=clean(sessionStorage.getItem(k));if(c.length!==4){c=code();sessionStorage.setItem(k,c)}return c}
function home(){location.href="../"}

const ROOM=hostCode("wheel"),PATH="games/wheel/"+ROOM,BANK=[["BEFORE & AFTER", "MONSTER MASHED POTATOES"], ["BEFORE & AFTER", "CANDY CORN ON THE COB"], ["BEFORE & AFTER", "BLACK CAT BURGLAR"], ["MOVIE", "THE NIGHTMARE BEFORE CHRISTMAS"], ["MOVIE", "A NIGHTMARE ON ELM STREET"], ["MOVIE", "THE TEXAS CHAINSAW MASSACRE"], ["SONG TITLE", "SOMEBODY'S WATCHING ME"], ["SONG TITLE", "I PUT A SPELL ON YOU"], ["PHRASE", "THINGS THAT GO BUMP IN THE NIGHT"], ["PHRASE", "TRICK OR TREAT SMELL MY FEET"], ["CHARACTER", "THE WICKED WITCH OF THE WEST"], ["CHARACTER", "THE HEADLESS HORSEMAN"], ["FOOD & DRINK", "BLOODY MARY"], ["THING", "JACK O LANTERN"], ["WHAT ARE YOU DOING?", "CARVING A PUMPKIN"], ["MOVIE", "GHOSTBUSTERS"], ["CHARACTER", "MICHAEL MYERS"], ["PHRASE", "DOUBLE DOUBLE TOIL AND TROUBLE"]],W=[100,150,200,250,300,350,400,500,600,700,"BANKRUPT","LOSE A TURN","FREE SPIN","STEAL $500"];document.getElementById("gc").textContent=ROOM;const $=x=>document.getElementById(x);let st={names:["Team Ghosts","Team Pumpkins"],scores:[0,0],roundScores:[0,0],active:0,puzzle:null,revealed:[],used:[],wheel:null,message:"",set:[],idx:0,spinId:0};function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function mask(){return st.puzzle.answer.split("").map(c=>/[A-Z]/.test(c)?(st.revealed.includes(c)?c:"_"):c).join(" ")}async function save(){st.names=[$("n0").value,$("n1").value];await req(PATH+"/state","PUT",st)}function render(){$("s0").textContent=st.scores[0]+st.roundScores[0];$("s1").textContent=st.scores[1]+st.roundScores[1];$("t0").classList.toggle("active",st.active===0);$("t1").classList.toggle("active",st.active===1);$("cat").textContent=st.puzzle.category;$("msg").textContent=st.message;$("puzzle").textContent=mask()}function load(){let p=st.set[st.idx];st.puzzle={category:p[0],answer:p[1]};st.revealed=[];st.used=[];st.roundScores=[0,0];st.wheel=null;st.message=st.names[st.active]+"'s turn — spin!"}function newGame(){st.scores=[0,0];st.active=0;st.set=shuffle(BANK).slice(0,8);st.idx=0;load();render();save()}function turn(){st.active=1-st.active;st.wheel=null}function spin(){let w=W[Math.floor(Math.random()*W.length)];st.wheel=w;st.spinId=Date.now();if(w==="BANKRUPT"){st.roundScores[st.active]=0;st.message="💀 BANKRUPT!";turn()}else if(w==="LOSE A TURN"){st.message="👻 LOSE A TURN!";turn()}else if(w==="FREE SPIN")st.message="🎃 FREE SPIN — spin again!";else if(w==="STEAL $500"){let o=1-st.active,x=Math.min(500,st.scores[o]);st.scores[o]-=x;st.scores[st.active]+=x;st.message="😈 Stole $"+x+"!"}else st.message="Wheel: $"+w+" — choose a consonant.";render();save()}function letter(L){if(st.used.includes(L))return;let vowel="AEIOU".includes(L);if(vowel){if(st.roundScores[st.active]<250)return alert("Need $250 in round money to buy a vowel.");st.roundScores[st.active]-=250}else if(typeof st.wheel!=="number")return alert("Spin first.");st.used.push(L);let n=[...st.puzzle.answer].filter(c=>c===L).length;if(n){st.revealed.push(L);if(!vowel)st.roundScores[st.active]+=st.wheel*n;st.wheel=null;st.message="✅ "+L+" appears "+n+" time(s)."}else{st.message="❌ No "+L;turn()}render();save()}function solve(){let a=prompt("Type their complete answer:");if(a&&a.toUpperCase().replace(/[^A-Z]/g,"")===st.puzzle.answer.replace(/[^A-Z]/g,"")){st.revealed=[..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"];st.scores[st.active]+=st.roundScores[st.active];st.roundScores=[0,0];st.message="🎉 CORRECT!"}else if(a){turn();st.message="❌ Not quite."}render();save()}function pass(){turn();render();save()}function next(){st.idx=(st.idx+1)%st.set.length;load();render();save()}"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(L=>{let b=document.createElement("button");b.textContent=L;b.onclick=()=>letter(L);$("alpha").appendChild(b)});["n0","n1"].forEach(x=>$(x).onchange=save);newGame();
</script></body></html>
