<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halloween Wheel - Host</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#32135a,#0d0716 60%);color:#fff;font-family:Arial,sans-serif;text-align:center;min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:16px}h1{color:#ff922b;margin:8px}.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}.team{padding:12px;border:3px solid #9258e8;border-radius:18px;background:#261346}.team.active{border-color:#ff9f1c;box-shadow:0 0 18px #ff9f1c}input{font-size:20px;width:75%;text-align:center;border:0;border-radius:8px;padding:5px}.score{font-size:32px;font-weight:bold}.status{font-size:24px;margin:14px}.cat{color:#ffbf69;font-weight:bold}.puzzle{font-size:27px;letter-spacing:4px;margin:12px;min-height:38px}button{font-size:17px;padding:11px 14px;margin:5px;border:0;border-radius:12px;background:#ff9f1c;color:#24102f;font-weight:bold}button.secondary{background:#9b5de5;color:white}button.danger{background:#ef476f;color:white}button:disabled{opacity:.35}.alpha{display:flex;flex-wrap:wrap;justify-content:center;max-width:800px;margin:auto}.alpha button{width:48px;margin:3px}.panel{background:#1d102f;border:1px solid #7141a4;border-radius:16px;padding:12px;margin-top:12px}#sync{margin:10px;color:#8ff0d0;font-weight:bold}.small{font-size:14px;opacity:.8}
</style></head><body><div class="wrap"><h1>🎡 Sanders' Halloween Wheel</h1><div class="teams">
<div id="t0" class="team active"><input id="n0" value="Team Ghosts"><div class="score">$<span id="s0">0</span></div></div>
<div id="t1" class="team"><input id="n1" value="Team Pumpkins"><div class="score">$<span id="s1">0</span></div></div></div>
<div class="status"><span class="cat" id="cat"></span><br><span id="msg">Start a new game!</span></div><div class="puzzle" id="puzzle"></div>
<div><button id="spin">🎡 SPIN</button><button id="vowel" class="secondary">Buy a Vowel ($250)</button><button id="solve" class="secondary">Solve Puzzle</button><button id="pass" class="danger">Wrong / Pass Turn</button></div>
<div class="alpha" id="alpha"></div><div class="panel"><button id="next">Next Puzzle ➜</button><button id="bonus">🏆 Bonus Round</button><button id="new">New Game</button><button onclick="location.href='../'">🏠 Game Night Home</button><div class="small">Host controls stay here. The TV displays the wheel and puzzle.</div></div><div id="sync">Game sync: connecting…</div></div>
<script>
const FIREBASE_BASE="https://halloween-fued-default-rtdb.firebaseio.com",ROOM="games/wheel",stateUrl=FIREBASE_BASE+"/"+ROOM+"/state.json";
const BANK=[["BEFORE & AFTER", "MONSTER MASHED POTATOES"], ["BEFORE & AFTER", "CANDY CORN ON THE COB"], ["BEFORE & AFTER", "BLACK CAT BURGLAR"], ["MOVIE", "THE NIGHTMARE BEFORE CHRISTMAS"], ["MOVIE", "A NIGHTMARE ON ELM STREET"], ["MOVIE", "THE TEXAS CHAINSAW MASSACRE"], ["SONG TITLE", "SOMEBODY'S WATCHING ME"], ["SONG TITLE", "I PUT A SPELL ON YOU"], ["PHRASE", "THINGS THAT GO BUMP IN THE NIGHT"], ["PHRASE", "TRICK OR TREAT SMELL MY FEET"], ["CHARACTER", "THE WICKED WITCH OF THE WEST"], ["CHARACTER", "THE HEADLESS HORSEMAN"], ["FOOD & DRINK", "BLOODY MARY"], ["THING", "JACK O LANTERN"], ["WHAT ARE YOU DOING?", "CARVING A PUMPKIN"], ["MOVIE", "GHOSTBUSTERS"], ["CHARACTER", "MICHAEL MYERS"], ["PHRASE", "DOUBLE DOUBLE TOIL AND TROUBLE"]],BONUS=[["PHRASE", "WICKED GOOD TIME"], ["THING", "HAUNTED HOUSE"], ["CHARACTER", "HEADLESS HORSEMAN"], ["PHRASE", "TRICK OR TREAT"], ["THING", "CRYSTAL BALL"]],WEDGES=[100,150,200,250,300,350,400,500,600,700,"BANKRUPT","LOSE A TURN","FREE SPIN","STEAL $500"];
let st={names:["Team Ghosts","Team Pumpkins"],scores:[0,0],roundScores:[0,0],active:0,puzzle:null,revealed:[],used:[],wheel:null,message:"Start a new game!",gameSet:[],idx:0,bonus:false,spinId:0};
const $=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function norm(s){return s.toUpperCase().replace(/[^A-Z]/g,"")}
function mask(){if(!st.puzzle)return "";return st.puzzle.answer.split("").map(c=>/[A-Z]/.test(c)?(st.revealed.includes(c)?c:"_"):c).join(" ")}
async function push(){st.names=[$("n0").value,$("n1").value];try{let r=await fetch(stateUrl,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(st)});if(!r.ok)throw Error();$("sync").textContent="Game sync: connected ✓"}catch(e){$("sync").textContent="Game sync: connection error"}render()}
function render(){$("s0").textContent=st.scores[0]+st.roundScores[0];$("s1").textContent=st.scores[1]+st.roundScores[1];$("t0").classList.toggle("active",st.active===0);$("t1").classList.toggle("active",st.active===1);$("cat").textContent=st.puzzle?st.puzzle.category:"";$("puzzle").textContent=mask();$("msg").textContent=st.message;document.querySelectorAll(".letter").forEach(b=>b.disabled=st.used.includes(b.textContent))}
function nextTurn(){st.active=1-st.active;st.wheel=null}function loadPuzzle(){let p=st.gameSet[st.idx];st.puzzle={category:p[0],answer:p[1]};st.revealed=[];st.used=[];st.roundScores=[0,0];st.wheel=null;st.message=st.names[st.active]+"'s turn — spin the wheel!"}
function newGame(){st.scores=[0,0];st.roundScores=[0,0];st.active=0;st.gameSet=shuffle(BANK).slice(0,8);st.idx=0;st.bonus=false;loadPuzzle();push()}
$("spin").onclick=()=>{if(!st.puzzle)return;let w=WEDGES[Math.floor(Math.random()*WEDGES.length)];st.wheel=w;st.spinId=Date.now();if(w==="BANKRUPT"){st.roundScores[st.active]=0;st.message="💀 BANKRUPT!";nextTurn()}else if(w==="LOSE A TURN"){st.message="👻 LOSE A TURN!";nextTurn()}else if(w==="FREE SPIN"){st.message="🎃 FREE SPIN — spin again!"}else if(w==="STEAL $500"){let o=1-st.active,x=Math.min(500,st.scores[o]);st.scores[o]-=x;st.scores[st.active]+=x;st.message="😈 Stole $"+x+"! Spin again."}else st.message="Wheel: $"+w+" — choose a consonant.";push()};
function chooseLetter(L){if(!st.puzzle||st.used.includes(L))return;let vowels="AEIOU".includes(L);if(vowels){if(st.roundScores[st.active]<250){st.message="You need $250 in round money to buy a vowel.";return push()}st.roundScores[st.active]-=250}else if(typeof st.wheel!=="number"){st.message="Spin first before choosing a consonant.";return push()}st.used.push(L);let count=[...st.puzzle.answer].filter(c=>c===L).length;if(count){st.revealed.push(L);if(!vowels)st.roundScores[st.active]+=st.wheel*count;st.message="✅ "+L+" appears "+count+" time"+(count===1?"":"s")+".";st.wheel=null}else{st.message="❌ No "+L+".";nextTurn()}push()}
"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(L=>{let b=document.createElement("button");b.textContent=L;b.className="letter";b.onclick=()=>chooseLetter(L);$("alpha").appendChild(b)});
$("vowel").onclick=()=>{st.message="Choose A, E, I, O or U below.";push()};$("pass").onclick=()=>{nextTurn();st.message="Turn passes to "+st.names[st.active]+".";push()};
$("solve").onclick=()=>{if(!st.puzzle)return;let ans=prompt("Type their complete answer:");if(ans===null)return;if(norm(ans)===norm(st.puzzle.answer)){st.revealed=[..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"];st.scores[st.active]+=st.roundScores[st.active];st.roundScores=[0,0];st.message="🎉 CORRECT! "+st.names[st.active]+" solved it!"}else{nextTurn();st.message="❌ Not quite. "+st.names[st.active]+" gets the turn."}push()};
$("next").onclick=()=>{if(!st.gameSet.length)return newGame();st.idx=(st.idx+1)%st.gameSet.length;loadPuzzle();push()};$("bonus").onclick=()=>{let p=BONUS[Math.floor(Math.random()*BONUS.length)];st.puzzle={category:"🏆 BONUS ROUND — "+p[0],answer:p[1]};st.revealed=["R","S","T","L","N","E"];st.used=["R","S","T","L","N","E"];st.roundScores=[0,0];st.wheel=null;st.bonus=true;st.message="RSTLNE revealed. Choose 3 consonants + 1 vowel, then solve!";push()};$("new").onclick=newGame;$("n0").onchange=push;$("n1").onchange=push;render();newGame();
</script></body></html>
