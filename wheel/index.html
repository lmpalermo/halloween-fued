<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halloween Wheel</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#32135a,#0d0716 60%);color:#fff;font-family:Arial;text-align:center;min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:14px}h1{color:#ff922b}.code{color:#ffbf69;font-size:1.3rem;font-weight:900}.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}.team{padding:10px;border:3px solid #9258e8;border-radius:18px;background:#261346}.team.active{border-color:#ff9f1c}.score{font-size:30px;font-weight:bold}input{font-size:19px;width:80%;text-align:center}.puzzle{font-size:26px;letter-spacing:4px;margin:12px}.alpha{display:flex;flex-wrap:wrap;justify-content:center}.alpha button{width:46px}button{font-size:16px;padding:10px 13px;margin:4px;border:0;border-radius:11px;background:#ff9f1c;color:#24102f;font-weight:bold}.secondary{background:#9b5de5;color:white}
.puzzle{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 24px;letter-spacing:0;margin:20px auto}.word{display:inline-flex;gap:4px;white-space:nowrap}.tile{display:inline-grid;place-items:center;width:clamp(18px,3vw,38px);height:clamp(28px,4vw,48px);background:#f9f2df;color:#24102f;border:2px solid #ff9f1c;border-radius:5px;font-weight:900;font-size:clamp(16px,2.5vw,30px)}button:disabled{opacity:.4;cursor:default}#msg{font-size:clamp(18px,2.2vw,28px);min-height:2em}#sync{font-size:14px;color:#ffcf85}.bonus{background:radial-gradient(ellipse at top,#641354,#10051e 70%)}.bonus #cat{color:#ffce61;text-shadow:0 0 15px #ff5714}.bonus.win #msg{color:#b7ff66;font-size:clamp(24px,4vw,52px)}#timer{font-size:32px;color:#ffce61;font-weight:bold}.wheel-shell{position:relative;width:190px;margin:12px auto}.wheel-shell:before{content:'▼';position:absolute;top:-15px;left:78px;color:#fff;font-size:30px;z-index:2}#wval{position:absolute;inset:48px 25px;display:grid;place-items:center;background:#160b27;border:3px solid #f6c453;border-radius:50%;font-size:20px;line-height:1.15;padding:8px;z-index:1}html,body{height:auto;min-height:100%;overflow:auto}
</style></head><body><div class="wrap"><h1>🎡 Sanders' Halloween Wheel</h1><div class="code">GAME CODE: <span id="gc"></span></div><button onclick="home()">🏠 Game Night Home</button><div class="teams"><div id="t0" class="team"><input id="n0" value="Team Ghosts"><div class="score">$<span id="s0">0</span></div></div><div id="t1" class="team"><input id="n1" value="Team Pumpkins"><div class="score">$<span id="s1">0</span></div></div></div><h2 id="cat"></h2><div id="msg"></div><div id="puzzle" class="puzzle"></div><button id="spinButton" onclick="spin()">🎡 SPIN</button><button class="secondary" onclick="solve()">Solve Puzzle</button><button id="passButton" onclick="pass()">Wrong / Pass Turn</button><div id="alpha" class="alpha"></div><button onclick="next()">Next Puzzle ➜</button><button onclick="newGame()">New Game</button><button class="secondary" onclick="bonusRound()">👻 BONUS ROUND</button><button id="revealBonus" onclick="revealBonus()" disabled>Reveal Bonus Letters / Start Timer</button><div id="timer"></div><div id="sync" role="status"></div></div><script>
const DB="https://halloween-fued-default-rtdb.firebaseio.com";
const code=()=>String(Math.floor(1000+Math.random()*9000));
const clean=v=>String(v||"").replace(/\D/g,"").slice(0,4);
async function req(path,method="GET",body){
 const r=await fetch(DB+"/"+path+".json",{method,headers:{"Content-Type":"application/json"},body:body===undefined?undefined:JSON.stringify(body),cache:"no-store"});
 if(!r.ok)throw Error("Firebase "+r.status); return r.json();
}
function hostCode(game){let k="sanders:"+game+":host",c=clean(sessionStorage.getItem(k));if(c.length!==4){c=code();sessionStorage.setItem(k,c)}return c}
function home(){location.href="../"}

const $=x=>document.getElementById(x);const ROOM=hostCode("wheel"),PATH="games/wheel/"+ROOM,BANK=[["BEFORE & AFTER", "MONSTER MASHED POTATOES"], ["BEFORE & AFTER", "CANDY CORN ON THE COB"], ["BEFORE & AFTER", "BLACK CAT BURGLAR"], ["MOVIE", "THE NIGHTMARE BEFORE CHRISTMAS"], ["MOVIE", "A NIGHTMARE ON ELM STREET"], ["MOVIE", "THE TEXAS CHAINSAW MASSACRE"], ["SONG TITLE", "SOMEBODY'S WATCHING ME"], ["SONG TITLE", "I PUT A SPELL ON YOU"], ["PHRASE", "THINGS THAT GO BUMP IN THE NIGHT"], ["PHRASE", "TRICK OR TREAT SMELL MY FEET"], ["CHARACTER", "THE WICKED WITCH OF THE WEST"], ["CHARACTER", "THE HEADLESS HORSEMAN"], ["FOOD & DRINK", "BLOODY MARY"], ["THING", "JACK O LANTERN"], ["WHAT ARE YOU DOING?", "CARVING A PUMPKIN"], ["MOVIE", "GHOSTBUSTERS"], ["CHARACTER", "MICHAEL MYERS"], ["PHRASE", "DOUBLE DOUBLE TOIL AND TROUBLE"]],W=[100,150,200,250,300,350,400,500,600,700,"BANKRUPT","LOSE A TURN","FREE SPIN","STEAL $500"];
function board(st){const box=$("puzzle");box.replaceChildren();for(const word of st.puzzle.answer.split(/ +/)){const group=document.createElement("span");group.className="word";for(const c of word){const tile=document.createElement("span");tile.className="tile";tile.textContent=/[A-Z]/.test(c)&&!(st.revealed||[]).includes(c)?"":c;group.appendChild(tile)}box.appendChild(group)}}
function countdown(st){const b=st.bonus;$("timer").textContent=b&&b.phase==="solve"?Math.max(0,Math.ceil((b.deadline-Date.now())/1000))+" seconds":""}

$("gc").textContent=ROOM;
let st={names:["Team Ghosts","Team Pumpkins"],scores:[0,0],roundScores:[0,0],active:0,puzzle:null,revealed:[],used:[],wheel:null,spinResult:null,message:"",set:[],idx:0,spinId:0,revision:0,bonus:null,solved:false};
let queue=Promise.resolve();
function save(){st.names=[$("n0").value,$("n1").value];st.revision++;const snapshot=JSON.parse(JSON.stringify(st));queue=queue.catch(()=>{}).then(()=>req(PATH+"/state","PUT",snapshot)).then(()=>{$("sync").textContent="TV synchronized"}).catch(()=>{$("sync").textContent="Connection lost — retrying latest state"});return queue}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function render(){for(let i=0;i<2;i++){$("s"+i).textContent=st.scores[i]+st.roundScores[i];$("t"+i).classList.toggle("active",st.active===i)}$("cat").textContent=(st.bonus?"👻 BONUS ROUND — ":"")+st.puzzle.category;$("msg").textContent=st.message;board(st);document.body.classList.toggle("bonus",!!st.bonus);document.body.classList.toggle("win",st.bonus?.phase==="won");$("spinButton").disabled=!!st.bonus||st.solved;$("passButton").disabled=!!st.bonus||st.solved;$("revealBonus").disabled=!st.bonus||st.bonus.phase!=="pick"||st.bonus.letters.length!==4;for(const b of $("alpha").children){const L=b.textContent,v="AEIOU".includes(L);b.disabled=st.used.includes(L)||st.solved||!!st.bonus&&(st.bonus.phase!=="pick"||st.bonus.letters.filter(x=>"AEIOU".includes(x)===v).length>=(v?1:3))}countdown(st)}
function update(){render();save()}
function load(){const p=st.set[st.idx];st.puzzle={category:p[0],answer:p[1]};st.revealed=[];st.used=[];st.roundScores=[0,0];st.wheel=null;st.spinResult=null;st.spinId=0;st.bonus=null;st.solved=false;st.message=st.names[st.active]+"'s turn — spin!"}
function newGame(){st.scores=[0,0];st.active=0;st.set=shuffle(BANK).slice(0,8);st.idx=0;load();update()}
function turn(){st.active=1-st.active;st.wheel=null}
function spin(){if(st.bonus||st.solved)return;const w=W[Math.floor(Math.random()*W.length)];st.wheel=w;st.spinResult=w;st.spinId=Math.max(Date.now(),st.spinId+1);if(w==="BANKRUPT"){st.roundScores[st.active]=0;turn();st.message="💀 BANKRUPT!"}else if(w==="LOSE A TURN"){turn();st.message="👻 LOSE A TURN!"}else if(w==="FREE SPIN")st.message="🎃 FREE SPIN — spin again!";else if(w==="STEAL $500"){const o=1-st.active,x=Math.min(500,st.scores[o]);st.scores[o]-=x;st.scores[st.active]+=x;st.message="😈 Stole $"+x+"!"}else st.message="Wheel: $"+w+" — choose a consonant.";update()}
function letter(L){if(st.used.includes(L)||st.solved)return;const vowel="AEIOU".includes(L);if(st.bonus){if(st.bonus.phase!=="pick")return;const picked=st.bonus.letters;if(picked.filter(x=>"AEIOU".includes(x)===vowel).length>=(vowel?1:3))return;picked.push(L);st.used.push(L);st.message="Bonus choices: "+picked.join(", ")+" — choose 3 consonants + 1 vowel.";update();return}if(vowel){if(st.roundScores[st.active]<250)return alert("Need $250 in round money to buy a vowel.");st.roundScores[st.active]-=250}else if(typeof st.wheel!=="number")return alert("Spin first.");st.used.push(L);const n=[...st.puzzle.answer].filter(c=>c===L).length;if(n){st.revealed.push(L);if(!vowel)st.roundScores[st.active]+=st.wheel*n;st.wheel=null;st.message="✅ "+L+" appears "+n+" time(s)."}else{st.message="❌ No "+L;turn()}update()}
const normalized=a=>a.toUpperCase().replace(/[^A-Z]/g,"");
function endBonus(won){st.bonus.phase=won?"won":"lost";st.solved=true;st.revealed=[..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"];st.message=won?"🎉👻 BONUS WIN! "+st.names[st.active]+" conquered the haunted puzzle!":"👻 The answer was: "+st.puzzle.answer;update()}
function solve(){if(st.solved||st.bonus&&st.bonus.phase!=="solve")return;if(st.bonus&&Date.now()>=st.bonus.deadline)return endBonus(false);const a=prompt("Type their complete answer:");if(!a)return;if(st.bonus){endBonus(Date.now()<st.bonus.deadline&&normalized(a)===normalized(st.puzzle.answer));return}if(normalized(a)===normalized(st.puzzle.answer)){st.revealed=[..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"];st.scores[st.active]+=st.roundScores[st.active];st.roundScores=[0,0];st.solved=true;st.wheel=null;st.message="🎉 CORRECT!"}else{turn();st.message="❌ Not quite."}update()}
function pass(){if(st.bonus||st.solved)return;turn();st.message=st.names[st.active]+"'s turn — spin!";update()}
function next(){st.idx=(st.idx+1)%st.set.length;load();update()}
function bonusRound(){if(st.bonus)return;const totals=st.scores.map((x,i)=>x+st.roundScores[i]);let winner=totals[1]>totals[0]?1:0;if(totals[0]===totals[1]){const choice=prompt("Scores are tied. Enter 1 for "+st.names[0]+" or 2 for "+st.names[1],"1");if(choice!=="1"&&choice!=="2")return;winner=Number(choice)-1}const candidates=BANK.filter(p=>!st.set.some(q=>q[1]===p[1]));const p=shuffle(candidates.length?candidates:BANK)[0];st.active=winner;st.puzzle={category:p[0],answer:p[1]};st.bonus={phase:"pick",letters:[],deadline:0};st.revealed=[..."RSTLNE"];st.used=[..."RSTLNE"];st.solved=false;st.wheel=null;st.spinResult=null;st.spinId=0;st.message=st.names[winner]+": choose 3 additional consonants and 1 vowel.";update()}
function revealBonus(){if(!st.bonus||st.bonus.phase!=="pick"||st.bonus.letters.length!==4)return;st.revealed.push(...st.bonus.letters);st.bonus.phase="solve";st.bonus.deadline=Date.now()+30000;st.message="👻 "+st.names[st.active]+" — 30 seconds to solve!";update()}
"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(L=>{const b=document.createElement("button");b.textContent=L;b.onclick=()=>letter(L);$("alpha").appendChild(b)});
["n0","n1"].forEach(x=>$(x).onchange=save);
setInterval(()=>{if(st.bonus?.phase==="solve"&&Date.now()>=st.bonus.deadline)endBonus(false);else countdown(st)},250);
setInterval(save,5000);
newGame();
</script></body></html>
