<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halloween Wheel TV</title><style>*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden}body{margin:0;background:radial-gradient(circle at 50% 5%,#4b1978 0,#190b2d 46%,#07040c 100%);color:#fff;font-family:Arial;text-align:center;min-height:100vh}.wrap{height:100vh;max-width:1200px;margin:auto;padding:8px 18px;display:flex;flex-direction:column;position:relative;z-index:1}body:before,body:after{content:"";position:fixed;top:-120px;width:430px;height:430px;opacity:.18;pointer-events:none;background:repeating-conic-gradient(from 0deg,transparent 0 14deg,#fff 14.3deg 14.8deg,transparent 15deg 30deg),repeating-radial-gradient(circle,#fff0 0 36px,#fff 37px 39px,#fff0 40px 74px);z-index:0}body:before{left:-120px}body:after{right:-120px;transform:scaleX(-1)}h1{color:#ff922b;margin:3px 0 5px;font-size:clamp(1.5rem,4vh,2.6rem);text-shadow:0 0 16px #ff6a00}.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}.team{padding:6px;border:3px solid #9258e8;border-radius:16px;background:#261346cc}.team.active{border-color:#ff9f1c;box-shadow:0 0 18px #ff8c2a77}.score{font-size:clamp(1.4rem,4vh,2.3rem);font-weight:bold}.puzzle{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;margin:7px auto;padding:9px 12px;background:#100719aa;border:2px solid #6e3aa8;border-radius:16px;max-width:100%}.word{display:inline-flex;gap:3px;white-space:nowrap}.tile{display:inline-grid;place-items:center;width:clamp(18px,2.8vw,36px);height:clamp(26px,4vh,44px);background:#fff6df;color:#24102f;border:2px solid #ff9f1c;border-radius:5px;font-weight:900;font-size:clamp(15px,2.3vw,28px);box-shadow:0 0 9px #ff8c2a66}button{font-size:14px;padding:7px 11px;border:0;border-radius:10px;background:#ff9f1c;color:#24102f;font-weight:bold}#join{position:fixed;inset:0;background:radial-gradient(circle at top,#321442,#0d0712 70%);display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px}#join>div{width:min(560px,92vw);padding:34px 24px;background:#251737;border:3px solid #ff9a3c;border-radius:24px;box-shadow:0 0 35px #9b5de566}#join input{display:block;font-size:2.4rem;width:220px;max-width:80%;height:68px;margin:14px auto;background:#fff;color:#241329;border:4px solid #ff9a3c;border-radius:14px;text-align:center;font-weight:900;letter-spacing:.18em}#wheelbox{position:relative;width:clamp(210px,31vh,330px);height:clamp(210px,31vh,330px);margin:5px auto;display:grid;place-items:center;filter:drop-shadow(0 0 18px #9b5de5aa)}#wheel{position:absolute;inset:0;border-radius:50%;border:6px solid #e7ddf2;transition:transform 2.3s cubic-bezier(.15,.7,.15,1);background:repeating-conic-gradient(from 0deg,transparent 0deg 10.8deg,#e7ddf2 11.1deg 11.7deg,transparent 12deg 22.5deg),repeating-radial-gradient(circle at center,#160b27 0 20%,transparent 20.5% 34%,#e7ddf2 34.5% 35.5%,transparent 36% 50%,#e7ddf2 50.5% 51.5%,transparent 52% 66%,#e7ddf2 66.5% 67.5%,transparent 68% 82%,#e7ddf2 82.5% 83.5%,transparent 84%);box-shadow:inset 0 0 28px #000,0 0 28px #9b5de588}#wheel:before{content:"🕷️";position:absolute;left:8%;top:8%;font-size:clamp(20px,4vh,34px);transform:rotate(-18deg)}#wval{position:relative;z-index:3;width:34%;height:34%;display:grid;place-items:center;background:#160b27;border:4px solid #ff9f1c;border-radius:50%;font-size:clamp(1rem,2.5vh,1.5rem);font-weight:900;padding:8px;text-shadow:0 0 10px #ff9f1c}#tvbar{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:2px}.qrmini{width:64px;height:64px;background:white;padding:3px;border-radius:8px}#cat{margin:2px 0;font-size:clamp(1.2rem,3.2vh,2rem);color:#ffbf69}#msg{font-size:clamp(1rem,2.6vh,1.6rem);font-weight:900;min-height:1.4em}.bonusgiven{color:#ffbf69;font-weight:900;font-size:clamp(.9rem,2.2vh,1.25rem)}#timer{font-size:clamp(2rem,7vh,4.5rem);font-weight:1000;color:#ffbf69;text-shadow:0 0 20px #ff6a00;line-height:1}</style></head><body><div id="join"><div><h1>🎡 Halloween Wheel TV</h1><div style="font-size:1.3rem;font-weight:900">Enter the 4-digit game code</div><input id="jc" maxlength="4" inputmode="numeric" placeholder="0000"><button onclick="joinGame()">JOIN GAME</button></div></div><div class="wrap"><h1>🎡 Sanders' Halloween Wheel</h1><div class="teams"><div id="t0" class="team"><b id="n0"></b><div class="score">$<span id="s0"></span></div></div><div id="t1" class="team"><b id="n1"></b><div class="score">$<span id="s1"></span></div></div></div><div id="tvbar"><button onclick="home()">🏠 Home</button><b>ROOM: <span id="roomcode"></span></b><img id="guestqr" class="qrmini"></div><div id="wheelbox"><div id="wheel"></div><div id="wval">SPIN!</div></div><h2 id="cat"></h2><div id="bonusgiven" class="bonusgiven"></div><div id="puzzle" class="puzzle"></div><div id="msg"></div><div id="timer"></div></div><script>
const DB="https://halloween-fued-default-rtdb.firebaseio.com";
const clean=v=>String(v||"").replace(/\D/g,"").slice(0,4);
const code=()=>String(Math.floor(1000+Math.random()*9000));
async function req(path,method="GET",body,headers={}){
 const r=await fetch(DB+"/"+path+".json",{method,headers:{"Content-Type":"application/json",...headers},
 body:body===undefined?undefined:JSON.stringify(body),cache:"no-store"});
 if(!r.ok) throw Error("Firebase "+r.status);
 return r.json();
}
function hostCode(game){
 const qp=clean(new URLSearchParams(location.search).get("room"));
 let k="sanders:"+game+":host",c=qp||clean(sessionStorage.getItem(k));
 if(c.length!==4)c=code(); sessionStorage.setItem(k,c); return c;
}
function home(){location.href="../"}
function guestUrl(game,room){return location.origin+"/guest.html?game="+encodeURIComponent(game)+"&room="+room}
function qrUrl(game,room){return "https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data="+encodeURIComponent(guestUrl(game,room))}

const $=x=>document.getElementById(x);let PATH="",gen=0,last=0,rot=0;function board(st){let box=$("puzzle");box.replaceChildren();for(const word of st.puzzle.answer.split(/ +/)){let g=document.createElement("span");g.className="word";for(const c of word){let t=document.createElement("span");t.className="tile";t.textContent=/[A-Z]/.test(c)&&!(st.revealed||[]).includes(c)?"":c;g.appendChild(t)}box.appendChild(g)}}function draw(st){if(!st.puzzle)return;for(let i=0;i<2;i++){$("n"+i).textContent=st.names[i];$("s"+i).textContent=st.scores[i]+st.roundScores[i];$("t"+i).classList.toggle("active",st.active===i)}$("cat").textContent=(st.bonus?"👻 BONUS ROUND — ":"")+st.puzzle.category;$("bonusgiven").textContent=st.bonus?"Given letters: R S T L N E":"";board(st);$("msg").textContent=st.message||"";if(st.bonus?.phase==="solve"&&st.bonus.deadline){let left=Math.max(0,Math.ceil((st.bonus.deadline-Date.now())/1000));$("timer").textContent=left>0?"⏳ "+left:"⏰ TIME'S UP!"}else $("timer").textContent="";if(st.spinId&&st.spinId!==last){rot+=1080+Math.floor(Math.random()*720);$("wheel").style.transform="rotate("+rot+"deg)"}last=st.spinId||0;let r=st.spinResult??st.wheel;$("wval").textContent=typeof r==="number"?"$"+r:r||"SPIN!"}async function poll(t){try{let v=await req(PATH);if(t===gen&&v)draw(v)}finally{if(t===gen)setTimeout(()=>poll(t),650)}}function joinGame(){let c=clean($("jc").value);if(c.length!==4)return alert("Enter 4 digits");PATH="games/wheel/"+c+"/state";$("roomcode").textContent=c;$("guestqr").src=qrUrl("wheel",c);localStorage.setItem("sanders:wheel:tv",c);$("join").style.display="none";poll(++gen)}$("jc").onkeydown=e=>{if(e.key==="Enter")joinGame()};const remembered=clean(localStorage.getItem("sanders:wheel:tv"));if(remembered.length===4)$("jc").value=remembered;
</script></body></html>
