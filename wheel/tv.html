<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halloween Wheel TV</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#32135a,#0d0716 60%);color:#fff;font-family:Arial;text-align:center;min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:14px}h1{color:#ff922b}.code{color:#ffbf69;font-size:1.3rem;font-weight:900}.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}.team{padding:10px;border:3px solid #9258e8;border-radius:18px;background:#261346}.team.active{border-color:#ff9f1c}.score{font-size:30px;font-weight:bold}input{font-size:19px;width:80%;text-align:center}.puzzle{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 24px;margin:20px auto}.word{display:inline-flex;gap:4px;white-space:nowrap}.tile{display:inline-grid;place-items:center;width:clamp(18px,3vw,38px);height:clamp(28px,4vw,48px);background:#f9f2df;color:#24102f;border:2px solid #ff9f1c;border-radius:5px;font-weight:900;font-size:clamp(16px,2.5vw,30px)}button{font-size:16px;padding:10px 13px;margin:4px;border:0;border-radius:11px;background:#ff9f1c;color:#24102f;font-weight:bold}button:disabled{opacity:.4}.secondary{background:#9b5de5;color:white}.alpha{display:flex;flex-wrap:wrap;justify-content:center}.alpha button{width:46px}.joinbox{background:#261346;border:2px solid #9258e8;border-radius:16px;padding:10px;margin:10px}.joinbox img{width:150px;height:150px;background:white;padding:5px}#msg{font-size:24px;min-height:2em}#join{position:fixed;inset:0;background:#140d20;display:flex;align-items:center;justify-content:center;z-index:99}#join input{font-size:2rem;width:180px;text-align:center}#wheel{margin:10px auto;width:180px;height:180px;border-radius:50%;border:6px solid #f6c453;background:conic-gradient(#ff9f1c 0 45deg,#8c52db 45deg 90deg,#ef476f 90deg 135deg,#06d6a0 135deg 180deg,#ffbf69 180deg 225deg,#7b2cbf 225deg 270deg,#f15bb5 270deg 315deg,#00bbf9 315deg 360deg);transition:transform 2.3s;position:relative}#wval{position:absolute;inset:48px 25px;display:grid;place-items:center;background:#160b27;border:3px solid #f6c453;border-radius:50%;font-weight:bold}</style></head><body><div id="join"><div><h1>🎡 Halloween Wheel TV</h1><input id="jc" maxlength="4" inputmode="numeric"><button onclick="joinGame()">JOIN</button></div></div><div class="wrap"><h1>🎡 Sanders' Halloween Wheel</h1><div class="teams"><div id="t0" class="team"><b id="n0"></b><div class="score">$<span id="s0"></span></div></div><div id="t1" class="team"><b id="n1"></b><div class="score">$<span id="s1"></span></div></div></div><div id="wheel"><div id="wval">SPIN!</div></div><h2 id="cat"></h2><div id="puzzle" class="puzzle"></div><div id="msg"></div></div><script>
const DB="https://halloween-fued-default-rtdb.firebaseio.com";
const clean=v=>String(v||"").replace(/\D/g,"").slice(0,4);
const code=()=>String(Math.floor(1000+Math.random()*9000));
async function req(path,method="GET",body,headers={}){
 const r=await fetch(DB+"/"+path+".json",{method,headers:{"Content-Type":"application/json",...headers},
 body:body===undefined?undefined:JSON.stringify(body),cache:"no-store"});
 if(!r.ok) throw Error("Firebase "+r.status);
 return r.json();
}
function hostCode(game){
 const qp=clean(new URLSearchParams(location.search).get("room"));
 let k="sanders:"+game+":host",c=qp||clean(sessionStorage.getItem(k));
 if(c.length!==4)c=code(); sessionStorage.setItem(k,c); return c;
}
function home(){location.href="../"}
function guestUrl(game,room){return location.origin+"/guest.html?game="+encodeURIComponent(game)+"&room="+room}
function qrUrl(game,room){return "https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data="+encodeURIComponent(guestUrl(game,room))}

const $=x=>document.getElementById(x);let PATH="",gen=0,last=0,rot=0;function board(st){let box=$("puzzle");box.replaceChildren();for(const word of st.puzzle.answer.split(/ +/)){let g=document.createElement("span");g.className="word";for(const c of word){let t=document.createElement("span");t.className="tile";t.textContent=/[A-Z]/.test(c)&&!(st.revealed||[]).includes(c)?"":c;g.appendChild(t)}box.appendChild(g)}}function draw(st){if(!st.puzzle)return;for(let i=0;i<2;i++){$("n"+i).textContent=st.names[i];$("s"+i).textContent=st.scores[i]+st.roundScores[i];$("t"+i).classList.toggle("active",st.active===i)}$("cat").textContent=(st.bonus?"👻 BONUS ROUND — ":"")+st.puzzle.category;board(st);$("msg").textContent=st.message||"";if(st.spinId&&st.spinId!==last){rot+=1080+Math.floor(Math.random()*720);$("wheel").style.transform="rotate("+rot+"deg)"}last=st.spinId||0;let r=st.spinResult??st.wheel;$("wval").textContent=typeof r==="number"?"$"+r:r||"SPIN!"}async function poll(t){try{let v=await req(PATH);if(t===gen&&v)draw(v)}finally{if(t===gen)setTimeout(()=>poll(t),650)}}function joinGame(){let c=clean($("jc").value);if(c.length!==4)return alert("Enter 4 digits");PATH="games/wheel/"+c+"/state";$("join").style.display="none";poll(++gen)}$("jc").onkeydown=e=>{if(e.key==="Enter")joinGame()};
</script></body></html>
