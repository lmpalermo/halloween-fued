<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halloween Wheel TV</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#32135a,#0d0716 60%);color:#fff;font-family:Arial;text-align:center;min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:14px}h1{color:#ff922b}.code{color:#ffbf69;font-size:1.3rem;font-weight:900}.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}.team{padding:10px;border:3px solid #9258e8;border-radius:18px;background:#261346}.team.active{border-color:#ff9f1c}.score{font-size:30px;font-weight:bold}input{font-size:19px;width:80%;text-align:center}.puzzle{font-size:26px;letter-spacing:4px;margin:12px}.alpha{display:flex;flex-wrap:wrap;justify-content:center}.alpha button{width:46px}button{font-size:16px;padding:10px 13px;margin:4px;border:0;border-radius:11px;background:#ff9f1c;color:#24102f;font-weight:bold}.secondary{background:#9b5de5;color:white}#join{position:fixed;inset:0;z-index:99999;background:#140d20;display:flex;align-items:center;justify-content:center}#join .joincard{width:min(560px,92vw);padding:28px;text-align:center;background:#251737;border:3px solid #ff9a3c;border-radius:22px}#join input{font-size:2.3rem;width:190px;text-align:center;letter-spacing:.28em;padding:10px;border-radius:12px}button{cursor:pointer}html,body{height:100%;overflow:hidden}#wheel{margin:10px auto;width:180px;height:180px;border-radius:50%;border:6px solid #f6c453;background:conic-gradient(#ff9f1c 0 45deg,#8c52db 45deg 90deg,#ef476f 90deg 135deg,#06d6a0 135deg 180deg,#ffbf69 180deg 225deg,#7b2cbf 225deg 270deg,#f15bb5 270deg 315deg,#00bbf9 315deg 360deg);display:flex;align-items:center;justify-content:center;transition:transform 2.3s}#wval{background:#160b27;border-radius:50%;padding:25px 10px;font-weight:bold}
.puzzle{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 24px;letter-spacing:0;margin:20px auto}.word{display:inline-flex;gap:4px;white-space:nowrap}.tile{display:inline-grid;place-items:center;width:clamp(18px,3vw,38px);height:clamp(28px,4vw,48px);background:#f9f2df;color:#24102f;border:2px solid #ff9f1c;border-radius:5px;font-weight:900;font-size:clamp(16px,2.5vw,30px)}button:disabled{opacity:.4;cursor:default}#msg{font-size:clamp(18px,2.2vw,28px);min-height:2em}#sync{font-size:14px;color:#ffcf85}.bonus{background:radial-gradient(ellipse at top,#641354,#10051e 70%)}.bonus #cat{color:#ffce61;text-shadow:0 0 15px #ff5714}.bonus.win #msg{color:#b7ff66;font-size:clamp(24px,4vw,52px)}#timer{font-size:32px;color:#ffce61;font-weight:bold}.wheel-shell{position:relative;width:190px;margin:12px auto}.wheel-shell:before{content:'▼';position:absolute;top:-15px;left:78px;color:#fff;font-size:30px;z-index:2}#wval{position:absolute;inset:48px 25px;display:grid;place-items:center;background:#160b27;border:3px solid #f6c453;border-radius:50%;font-size:20px;line-height:1.15;padding:8px;z-index:1}html,body{height:auto;min-height:100%;overflow:auto}
</style></head><body>
<div id="join"><div class="joincard"><h1>🎡 Halloween Wheel</h1><h2>📺 Join Game</h2><p>Enter the 4-digit Game Code shown on the host tablet.</p>
<input id="jc" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="1234"><br>
<button onclick="joinGame()">JOIN GAME</button><button onclick="home()">🏠 Game Night Home</button></div></div>
<div class="wrap"><h1>🎡 Sanders' Halloween Wheel</h1><div class="teams"><div id="t0" class="team"><b id="n0"></b><div class="score">$<span id="s0"></span></div></div><div id="t1" class="team"><b id="n1"></b><div class="score">$<span id="s1"></span></div></div></div><div class="wheel-shell"><div id="wheel"></div><div id="wval">SPIN!</div></div><h2 id="cat"></h2><div id="puzzle" class="puzzle"></div><div id="msg"></div><div id="timer"></div><div id="sync" role="status"></div></div><script>
const DB="https://halloween-fued-default-rtdb.firebaseio.com";
const code=()=>String(Math.floor(1000+Math.random()*9000));
const clean=v=>String(v||"").replace(/\D/g,"").slice(0,4);
async function req(path,method="GET",body){
 const r=await fetch(DB+"/"+path+".json",{method,headers:{"Content-Type":"application/json"},body:body===undefined?undefined:JSON.stringify(body),cache:"no-store"});
 if(!r.ok)throw Error("Firebase "+r.status); return r.json();
}
function hostCode(game){let k="sanders:"+game+":host",c=clean(sessionStorage.getItem(k));if(c.length!==4){c=code();sessionStorage.setItem(k,c)}return c}
function home(){location.href="../"}


function board(st){const box=$("puzzle");box.replaceChildren();for(const word of st.puzzle.answer.split(/ +/)){const group=document.createElement("span");group.className="word";for(const c of word){const tile=document.createElement("span");tile.className="tile";tile.textContent=/[A-Z]/.test(c)&&!(st.revealed||[]).includes(c)?"":c;group.appendChild(tile)}box.appendChild(group)}}
function countdown(st){const b=st.bonus;$("timer").textContent=b&&b.phase==="solve"?Math.max(0,Math.ceil((b.deadline-Date.now())/1000))+" seconds":""}

const $=x=>document.getElementById(x);let PATH="",last=0,rot=0,current=null,generation=0;
function draw(st){if(!st.puzzle)return;current=st;for(let i=0;i<2;i++){$("n"+i).textContent=(st.names||[])[i]||"Team "+(i+1);$("s"+i).textContent=((st.scores||[])[i]||0)+((st.roundScores||[])[i]||0);$("t"+i).classList.toggle("active",st.active===i)}$("cat").textContent=(st.bonus?"👻 BONUS ROUND — ":"")+st.puzzle.category;board(st);$("msg").textContent=st.message||"";document.body.classList.toggle("bonus",!!st.bonus);document.body.classList.toggle("win",st.bonus?.phase==="won");if(st.spinId&&st.spinId!==last){rot+=1080+Math.floor(Math.random()*720);$("wheel").style.transform="rotate("+rot+"deg)"}last=st.spinId||0;const result=st.spinResult??st.wheel;$("wval").textContent=st.bonus?"👻 BONUS":typeof result==="number"?"$"+result:result||"SPIN!";countdown(st)}
async function poll(token){try{const v=await req(PATH);if(token!==generation)return;if(v){draw(v);$("sync").textContent=""}else $("sync").textContent="Waiting for host…"}catch(e){if(token===generation)$("sync").textContent="Connection lost — reconnecting…"}finally{if(token===generation)setTimeout(()=>poll(token),700)}}
function joinGame(){const c=clean($("jc").value);if(c.length!==4)return alert("Enter all 4 numbers.");PATH="games/wheel/"+c+"/state";last=0;current=null;$("join").style.display="none";poll(++generation)}
$("jc").addEventListener("keydown",e=>{if(e.key==="Enter")joinGame()});setInterval(()=>{if(current)countdown(current)},250);
</script></body></html>
