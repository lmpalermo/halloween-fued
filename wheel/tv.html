<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halloween Wheel TV</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#32135a,#0d0716 60%);color:#fff;font-family:Arial;text-align:center;min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:14px}h1{color:#ff922b}.code{color:#ffbf69;font-size:1.3rem;font-weight:900}.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}.team{padding:10px;border:3px solid #9258e8;border-radius:18px;background:#261346}.team.active{border-color:#ff9f1c}.score{font-size:30px;font-weight:bold}input{font-size:19px;width:80%;text-align:center}.puzzle{font-size:26px;letter-spacing:4px;margin:12px}.alpha{display:flex;flex-wrap:wrap;justify-content:center}.alpha button{width:46px}button{font-size:16px;padding:10px 13px;margin:4px;border:0;border-radius:11px;background:#ff9f1c;color:#24102f;font-weight:bold}.secondary{background:#9b5de5;color:white}#join{position:fixed;inset:0;z-index:99999;background:#140d20;display:flex;align-items:center;justify-content:center}#join .joincard{width:min(560px,92vw);padding:28px;text-align:center;background:#251737;border:3px solid #ff9a3c;border-radius:22px}#join input{font-size:2.3rem;width:190px;text-align:center;letter-spacing:.28em;padding:10px;border-radius:12px}button{cursor:pointer}html,body{height:100%;overflow:hidden}#wheel{margin:10px auto;width:180px;height:180px;border-radius:50%;border:6px solid #f6c453;background:conic-gradient(#ff9f1c 0 45deg,#8c52db 45deg 90deg,#ef476f 90deg 135deg,#06d6a0 135deg 180deg,#ffbf69 180deg 225deg,#7b2cbf 225deg 270deg,#f15bb5 270deg 315deg,#00bbf9 315deg 360deg);display:flex;align-items:center;justify-content:center;transition:transform 2.3s}#wval{background:#160b27;border-radius:50%;padding:25px 10px;font-weight:bold}</style></head><body>
<div id="join"><div class="joincard"><h1>🎡 Halloween Wheel</h1><h2>📺 Join Game</h2><p>Enter the 4-digit Game Code shown on the host tablet.</p>
<input id="jc" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="1234"><br>
<button onclick="joinGame()">JOIN GAME</button><button onclick="home()">🏠 Game Night Home</button></div></div>
<div class="wrap"><h1>🎡 Sanders' Halloween Wheel</h1><div class="teams"><div id="t0" class="team"><b id="n0"></b><div class="score">$<span id="s0"></span></div></div><div id="t1" class="team"><b id="n1"></b><div class="score">$<span id="s1"></span></div></div></div><div id="wheel"><div id="wval">SPIN!</div></div><h2 id="cat"></h2><div id="puzzle" class="puzzle"></div><div id="msg"></div></div><script>
const DB="https://halloween-fued-default-rtdb.firebaseio.com";
const code=()=>String(Math.floor(1000+Math.random()*9000));
const clean=v=>String(v||"").replace(/\D/g,"").slice(0,4);
async function req(path,method="GET",body){
 const r=await fetch(DB+"/"+path+".json",{method,headers:{"Content-Type":"application/json"},body:body===undefined?undefined:JSON.stringify(body),cache:"no-store"});
 if(!r.ok)throw Error("Firebase "+r.status); return r.json();
}
function hostCode(game){let k="sanders:"+game+":host",c=clean(sessionStorage.getItem(k));if(c.length!==4){c=code();sessionStorage.setItem(k,c)}return c}
function home(){location.href="../"}

const $=x=>document.getElementById(x);let PATH="",last=0,rot=0,poller;function mask(st){return st.puzzle.answer.split("").map(c=>/[A-Z]/.test(c)?(st.revealed.includes(c)?c:"_"):c).join(" ")}function draw(st){$("n0").textContent=st.names[0];$("n1").textContent=st.names[1];$("s0").textContent=st.scores[0]+st.roundScores[0];$("s1").textContent=st.scores[1]+st.roundScores[1];$("t0").classList.toggle("active",st.active===0);$("t1").classList.toggle("active",st.active===1);$("cat").textContent=st.puzzle.category;$("puzzle").textContent=mask(st);$("msg").textContent=st.message;if(st.spinId!==last){last=st.spinId;rot+=1080+Math.floor(Math.random()*720);$("wheel").style.transform="rotate("+rot+"deg)";setTimeout(()=>$("wval").textContent=typeof st.wheel==="number"?"$"+st.wheel:(st.wheel||"SPIN!"),2100)}}async function poll(){let v=await req(PATH);if(v)draw(v)}function joinGame(){let c=clean($("jc").value);if(c.length!==4)return alert("Enter all 4 numbers.");PATH="games/wheel/"+c+"/state";$("join").style.display="none";poll();poller=setInterval(poll,700)}
</script></body></html>
