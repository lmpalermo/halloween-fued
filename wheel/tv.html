<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halloween Wheel - TV</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:radial-gradient(circle at top,#35145f,#090510 65%);color:#fff;font-family:Arial,sans-serif;text-align:center}.wrap{height:100vh;padding:1.4vh 2vw;display:flex;flex-direction:column}h1{margin:.2vh;color:#ff922b;font-size:4vh}.teams{display:grid;grid-template-columns:1fr 1fr;gap:2vw;margin:1vh 0}.team{background:#271344;border:3px solid #8c52db;border-radius:16px;padding:.7vh;font-size:2.4vh}.team.active{border-color:#ff9f1c;box-shadow:0 0 15px #ff9f1c}.money{font-size:3.5vh;font-weight:bold}.wheelbox{height:24vh;display:flex;align-items:center;justify-content:center;position:relative}.pointer{position:absolute;top:0;font-size:4vh;z-index:2}#wheel{width:21vh;height:21vh;border-radius:50%;border:6px solid #f6c453;background:conic-gradient(#ff9f1c 0 30deg,#8c52db 30deg 60deg,#ef476f 60deg 90deg,#06d6a0 90deg 120deg,#ffbf69 120deg 150deg,#7b2cbf 150deg 180deg,#f15bb5 180deg 210deg,#00bbf9 210deg 240deg,#fee440 240deg 270deg,#9b5de5 270deg 300deg,#ff6b35 300deg 330deg,#4cc9f0 330deg 360deg);display:flex;align-items:center;justify-content:center;transition:transform 2.5s cubic-bezier(.15,.7,.15,1)}#wval{background:#160b27;border-radius:50%;width:10vh;height:10vh;display:flex;align-items:center;justify-content:center;font-size:1.9vh;font-weight:bold;padding:5px}.cat{font-size:2.8vh;color:#ffbf69;font-weight:bold;margin:.5vh}#board{flex:1;display:flex;align-items:center;justify-content:center;align-content:center;flex-wrap:wrap;gap:.6vh;max-width:95vw;margin:auto}.tile{height:8vh;min-width:5.3vh;padding:0 .8vh;background:#f5efe0;color:#15101b;border:4px solid #3b2359;border-radius:5px;font-size:5vh;font-weight:bold;display:flex;align-items:center;justify-content:center}.blank{background:transparent;border-color:transparent;min-width:2.7vh}#msg{font-size:2.5vh;font-weight:bold;min-height:3.2vh;margin:.7vh}#sync{font-size:1.7vh;color:#8ff0d0}
</style></head><body><div class="wrap"><h1>🎡 Sanders' Halloween Wheel</h1><div class="teams"><div id="t0" class="team"><span id="n0">Team Ghosts</span><div class="money">$<span id="s0">0</span></div></div><div id="t1" class="team"><span id="n1">Team Pumpkins</span><div class="money">$<span id="s1">0</span></div></div></div><div class="wheelbox"><div class="pointer">▼</div><div id="wheel"><div id="wval">SPIN!</div></div></div><div class="cat" id="cat">HALLOWEEN WHEEL</div><div id="board"></div><div id="msg">Waiting for host…</div><div id="sync">Game sync: connecting…</div></div><script>
const FIREBASE_BASE="https://halloween-fued-default-rtdb.firebaseio.com",ROOM="games/wheel",stateUrl=FIREBASE_BASE+"/"+ROOM+"/state.json";let lastSpin=0,rot=0;const $=id=>document.getElementById(id);
function draw(st){$("n0").textContent=st.names[0];$("n1").textContent=st.names[1];$("s0").textContent=st.scores[0]+st.roundScores[0];$("s1").textContent=st.scores[1]+st.roundScores[1];$("t0").classList.toggle("active",st.active===0);$("t1").classList.toggle("active",st.active===1);$("cat").textContent=st.puzzle?st.puzzle.category:"HALLOWEEN WHEEL";$("msg").textContent=st.message||"";let b=$("board");b.innerHTML="";if(st.puzzle){[...st.puzzle.answer].forEach(c=>{let d=document.createElement("div");if(c===" "){d.className="tile blank"}else{d.className="tile";d.textContent=/[A-Z]/.test(c)?(st.revealed.includes(c)?c:""):c}b.appendChild(d)})}if(st.spinId&&st.spinId!==lastSpin){lastSpin=st.spinId;rot+=1080+Math.floor(Math.random()*720);$("wheel").style.transform="rotate("+rot+"deg)";setTimeout(()=>{$("wval").textContent=typeof st.wheel==="number"?"$"+st.wheel:(st.wheel||"SPIN!")},2200)}else $("wval").textContent=typeof st.wheel==="number"?"$"+st.wheel:(st.wheel||"SPIN!")}
async function poll(){try{let r=await fetch(stateUrl+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error();let st=await r.json();if(st)draw(st);$("sync").textContent="Game sync: connected ✓"}catch(e){$("sync").textContent="Game sync: connection error"}}poll();setInterval(poll,800);
</script></body></html>
