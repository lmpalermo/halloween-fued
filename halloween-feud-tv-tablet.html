*{box-sizing:border-box}body{margin:0;padding:24px;background:#140d20;color:#fff5e9;font-family:system-ui,sans-serif}main{max-width:1000px;margin:auto}h1{text-align:center;color:#ff9a3c;font-size:2.5rem}.scores,.controls{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:20px 0}.team{flex:1;min-width:220px;padding:18px;border:2px solid #64477c;border-radius:16px;text-align:center;background:#251737}.team.active{border-color:#ff9a3c}.team input{width:100%;background:transparent;color:white;border:0;text-align:center;font:inherit}.score{font-size:2.6rem;font-weight:bold}#question{text-align:center;font-size:1.7rem}#status,#round,#bank,#strikes{text-align:center}#bank{font-size:1.4rem}#strikes{color:#ff6464;font-size:2rem;min-height:48px}#board{display:grid;gap:10px}button{padding:12px 18px;border:0;border-radius:10px;background:#ff9a3c;color:#241329;font:inherit;font-weight:bold;cursor:pointer}button:disabled{opacity:.45;cursor:default}.answer{display:flex;justify-content:space-between;background:#392451;color:white;min-height:62px;font-size:1.3rem;border:1px solid #64477c}.answer.revealed{background:#235246;border-color:#83d4b7}.answer:disabled{opacity:1}.danger{background:#ff6464}details{margin-top:24px;padding:14px;border:1px solid #64477c;border-radius:10px}summary{cursor:pointer}#key{line-height:1.9}.hint{color:#cbb9d9;text-align:center;font-size:.9rem}

.modebar{display:flex;gap:10px;justify-content:center;margin:10px 0 18px}.tv-only{display:none}.tv-mode .host-only{display:none!important}.tv-mode .tv-only{display:block}.tv-mode body{}.tv-mode main{max-width:1200px}.tv-mode h1{font-size:3.2rem}.tv-mode #question{font-size:2.3rem}.tv-mode .answer{font-size:1.8rem;min-height:82px}.tv-mode .score{font-size:3.2rem}
</style>
</head>
<body><main>
<h1>🎃 Halloween Feud</h1><div class="modebar host-only"><button id="tvMode">TV Display Mode</button><button id="hostMode">Host Mode</button></div>
<div class="scores">
<div class="team" id="team0"><input id="name0" value="Team Ghosts" aria-label="Team one name"><div class="score" id="score0">0</div></div>
<div class="team" id="team1"><input id="name1" value="Team Pumpkins" aria-label="Team two name"><div class="score" id="score1">0</div></div>
</div>
<p id="round"></p><h2 id="question"></h2><p id="bank"></p><div id="strikes" aria-label="Strikes"></div><p id="status" aria-live="polite"></p><div id="board"></div>
<div class="controls host-only">
<button id="switch">Switch controlling team</button><button id="strike" class="danger">❌ Strike</button><button id="award">Award round</button><button id="failed">Steal failed</button><button id="next">Next round →</button><button id="undo">Undo</button><button id="fullscreen">Fullscreen</button><button id="reset">New game</button>
</div>
<p class="hint">Click a numbered answer when a player guesses it. Change team names by clicking them.</p>
<details id="hostKey" class="host-only"><summary>Host answer key — opening this exposes the answers</summary><ol id="key"></ol></details>
</main>

const $=id=>document.getElementById(id);
let history=[],state;
function initialState(){return {round:0,scores:[0,0],controller:0,strikes:0,revealed:[],bank:0,phase:"play",winner:null};}
function remember(){history.push(JSON.stringify(state));}
function teamName(index){return $("name"+index).value.trim()||`Team ${index+1}`;}
function settle(winner){state.scores[winner]+=state.bank;state.winner=winner;state.phase="settled";}
function reveal(index){
if(state.phase==="settled"||state.revealed.includes(index))return;
remember();state.revealed.push(index);state.bank+=QUESTIONS[state.round].answers[index][1];
if(state.phase==="steal")settle(1-state.controller);
else if(state.revealed.length===QUESTIONS[state.round].answers.length)settle(state.controller);
render();
}
function render(){
const q=QUESTIONS[state.round],playing=state.phase==="play",stealing=state.phase==="steal",settled=state.phase==="settled";
const active=settled?state.winner:stealing?1-state.controller:state.controller;
for(let i=0;i<2;i++){$("score"+i).textContent=state.scores[i];$("team"+i).classList.toggle("active",active===i);}
$("round").textContent=`Round ${state.round+1} of ${QUESTIONS.length}`;
$("question").textContent=q.question;$("bank").textContent=`Round points: ${state.bank}`;$("strikes").textContent="❌ ".repeat(state.strikes);
if(settled){let message=`${teamName(state.winner)} wins ${state.bank} points!`;if(state.round===QUESTIONS.length-1){const[a,b]=state.scores;message+=a===b?" The game ends in a tie!":` ${teamName(a>b?0:1)} wins the game!`;}$("status").textContent=message;}
else if(stealing)$("status").textContent=`${teamName(active)}: one guess to steal! Reveal a correct answer, or click “Steal failed.”`;
else $("status").textContent=`${teamName(active)} is playing.`;
$("board").replaceChildren();
q.answers.forEach(([answer,points],index)=>{const shown=state.revealed.includes(index),button=document.createElement("button");button.className="answer"+(shown?" revealed":"");button.disabled=shown||settled;button.setAttribute("aria-label",shown?`${answer}, ${points} points`:`Reveal answer ${index+1}`);const text=document.createElement("span"),score=document.createElement("span");text.textContent=shown?answer:`Answer ${index+1}`;score.textContent=shown?points:"🎃";button.append(text,score);button.onclick=()=>reveal(index);$("board").append(button);});
$("key").replaceChildren();q.answers.forEach(([answer,points])=>{const item=document.createElement("li");item.textContent=`${answer} — ${points}`;$("key").append(item);});
$("switch").disabled=!playing;$("strike").disabled=!playing;$("award").disabled=!playing;$("failed").disabled=!stealing;$("next").disabled=!settled||state.round===QUESTIONS.length-1;$("undo").disabled=history.length===0;
}
$("switch").onclick=()=>{remember();state.controller=1-state.controller;render();};
$("strike").onclick=()=>{remember();state.strikes++;if(state.strikes===3)state.phase="steal";render();};
$("award").onclick=()=>{remember();settle(state.controller);render();};
$("failed").onclick=()=>{remember();settle(state.controller);render();};
$("next").onclick=()=>{remember();state.round++;state.controller=state.round%2;state.strikes=0;state.revealed=[];state.bank=0;state.phase="play";state.winner=null;$("hostKey").open=false;render();};
$("undo").onclick=()=>{if(history.length){state=JSON.parse(history.pop());render();}};
$("reset").onclick=()=>{if(!confirm("Start a new game and clear both scores?"))return;remember();state=initialState();$("hostKey").open=false;render();};
$("fullscreen").onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{alert("Fullscreen is unavailable. Use your browser’s fullscreen command.");}};
$("name0").oninput=render;$("name1").oninput=render;

// Two-screen helper. Open the same file on both devices.
// Host changes are mirrored through localStorage when both browsers share the same origin/storage.
function saveShared(){try{localStorage.setItem("halloweenFeudState",JSON.stringify({state,names:[$("name0").value,$("name1").value],ts:Date.now()}));}catch(e){}}
function loadShared(){try{const raw=localStorage.getItem("halloweenFeudState");if(!raw)return;const d=JSON.parse(raw);if(d.state){state=d.state;if(d.names){$("name0").value=d.names[0];$("name1").value=d.names[1];}render();}}catch(e){}}
const originalRender=render;render=function(){originalRender();saveShared();};
window.addEventListener("storage",e=>{if(e.key==="halloweenFeudState" && document.documentElement.classList.contains("tv-mode")) loadShared();});
$("tvMode").onclick=()=>{document.documentElement.classList.add("tv-mode");loadShared();};
$("hostMode").onclick=()=>document.documentElement.classList.remove("tv-mode");

state=initialState();render();
