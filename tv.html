const $ = id => document.getElementById(id);
let state = {round:0,scores:[0,0],controller:0,strikes:0,revealed:[],bank:0,phase:"play",winner:null};
let names = ["Team Ghosts","Team Pumpkins"];

function teamName(i){ return (names[i] || ("Team " + (i+1))).trim(); }

function render(){
  const q = QUESTIONS[state.round] || QUESTIONS[0];
  const settled = state.phase === "settled";
  const stealing = state.phase === "steal";
  const active = settled ? state.winner : (stealing ? 1-state.controller : state.controller);

  for(let i=0;i<2;i++){
    $("score"+i).textContent = state.scores[i] || 0;
    $("name"+i).textContent = teamName(i);
    $("team"+i).classList.toggle("active", active === i);
  }
  $("round").textContent = "Round " + (state.round+1) + " of " + QUESTIONS.length;
  $("question").textContent = q.question;
  $("bank").textContent = "Round points: " + (state.bank || 0);
  $("strikes").textContent = "❌ ".repeat(state.strikes || 0);

  if(settled){
    let msg = teamName(state.winner) + " wins " + state.bank + " points!";
    if(state.round === QUESTIONS.length-1){
      const a=state.scores[0], b=state.scores[1];
      msg += a===b ? " The game ends in a tie!" : " " + teamName(a>b?0:1) + " wins the game!";
    }
    $("status").textContent = msg;
  } else if(stealing){
    $("status").textContent = teamName(active) + ": one guess to steal!";
  } else {
    $("status").textContent = teamName(active) + " is playing.";
  }

  const board = $("board");
  while(board.firstChild) board.removeChild(board.firstChild);
  q.answers.forEach(function(pair,index){
    const shown = (state.revealed || []).indexOf(index) !== -1;
    const row = document.createElement("div");
    row.className = "answer" + (shown ? " revealed" : "");
    const text = document.createElement("span");
    const score = document.createElement("span");
    text.textContent = shown ? pair[0] : "Answer " + (index+1);
    score.textContent = shown ? pair[1] : "🎃";
    row.appendChild(text); row.appendChild(score); board.appendChild(row);
  });
}

let audioCtx=null,musicInterval=null,timerInterval=null,lastTimerCommand=0;
function ensureAudio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
}
function tone(freq,start,duration,gain,type){
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type||'sine';o.frequency.setValueAtTime(freq,start);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(gain,start+.05);g.gain.exponentialRampToValueAtTime(.0001,start+duration);o.connect(g).connect(audioCtx.destination);o.start(start);o.stop(start+duration);
}
function spookyPhrase(){
  if(!audioCtx)return;const t=audioCtx.currentTime;
  tone(55,t,1.4,.055,'sine');tone(82.41,t,.8,.035,'triangle');tone(77.78,t+.38,.7,.03,'triangle');tone(69.30,t+.78,.8,.032,'triangle');
  tone(329.63,t+.12,.22,.018,'sine');tone(311.13,t+.55,.25,.018,'sine');
}
function stopMusic(){if(musicInterval){clearInterval(musicInterval);musicInterval=null;}}
function scream(){
  if(!audioCtx)return;const t=audioCtx.currentTime,d=1.6,rate=audioCtx.sampleRate,buf=audioCtx.createBuffer(1,rate*d,rate),data=buf.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(1-i/data.length);
  const src=audioCtx.createBufferSource(),filter=audioCtx.createBiquadFilter(),g=audioCtx.createGain();src.buffer=buf;filter.type='bandpass';filter.frequency.setValueAtTime(1500,t);filter.frequency.exponentialRampToValueAtTime(500,t+d);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.32,t+.08);g.gain.exponentialRampToValueAtTime(.0001,t+d);src.connect(filter).connect(g).connect(audioCtx.destination);src.start(t);
  tone(1000,t,1.3,.12,'sawtooth');
}
function stopTvTimer(){stopMusic();if(timerInterval){clearInterval(timerInterval);timerInterval=null;}$('tvTimer').style.display='none';}
function runTvTimer(endsAt){
  stopTvTimer();ensureAudio();spookyPhrase();musicInterval=setInterval(spookyPhrase,1500);
  function tick(){const ms=endsAt-Date.now(),left=Math.max(0,Math.ceil(ms/1000));$('tvTimer').textContent=left;$('tvTimer').style.display='block';if(ms<=0){stopTvTimer();$('tvTimer').textContent='TIME!';$('tvTimer').style.display='block';scream();setTimeout(function(){$('tvTimer').style.display='none';},1800);}}
  tick();timerInterval=setInterval(tick,100);
}
$('enableSound').onclick=function(){ensureAudio();tone(220,audioCtx.currentTime,.12,.025,'sine');$('soundSetup').style.display='none';localStorage.setItem('halloweenFeudSoundEnabled','1');};
// Browsers still require a real user gesture after a fresh TV/browser session, so show the button each new page load.
timerRef.on('value',function(snapshot){const t=snapshot.val()||{};if(!t.commandId||t.commandId===lastTimerCommand)return;lastTimerCommand=t.commandId;if(t.status==='running'&&t.endsAt>Date.now()){runTvTimer(t.endsAt);}else if(t.status==='stopped'){stopTvTimer();}});

gameRef.on("value", function(snapshot){
  if(!snapshot.exists()){
    $("connection").textContent = "Waiting for host…";
    return;
  }
  const v = snapshot.val() || {};
  if(v.state) state = v.state;
  if(v.names) names = v.names;
  render();
  $("connection").textContent = "Live";
}, function(){
  $("connection").textContent = "Connection error";
});
