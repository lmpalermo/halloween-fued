<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Halloween Feud TV</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#140d20;color:#fff5e9;font-family:system-ui,sans-serif}
body{padding:20px}
main{max-width:1500px;margin:auto}
h1{text-align:center;color:#ff9a3c;font-size:3.2rem;margin:.15em 0 .35em}
.scores{display:flex;gap:18px;margin:10px 0 18px}
.team{flex:1;padding:16px;border:3px solid #64477c;border-radius:18px;text-align:center;background:#251737}
.team.active{border-color:#ff9a3c}
.name{font-size:1.45rem;font-weight:700}
.score{font-size:3.4rem;font-weight:900}
#round,#bank,#strikes,#status{text-align:center;margin:8px 0}
#question{text-align:center;font-size:2.2rem;margin:10px 0 12px}
#bank{font-size:1.45rem}
#strikes{color:#ff6464;font-size:2.5rem;min-height:50px}
#status{font-size:1.2rem}
#board{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.answer{display:flex;justify-content:space-between;align-items:center;background:#392451;color:white;min-height:78px;font-size:1.65rem;border:2px solid #64477c;border-radius:12px;padding:14px 18px;font-weight:800}
.answer.revealed{background:#235246;border-color:#83d4b7}
#connection{position:fixed;right:10px;bottom:8px;font-size:.8rem;opacity:.45}#soundSetup{position:fixed;inset:0;z-index:9999;background:rgba(20,13,32,.96);display:flex;align-items:center;justify-content:center;padding:24px}#soundCard{max-width:620px;text-align:center;background:#251737;border:3px solid #ff9a3c;border-radius:22px;padding:32px}#soundCard h2{font-size:2rem;margin-top:0}#enableSound{font-size:1.5rem;padding:18px 28px;border:0;border-radius:14px;background:#ff9a3c;color:#241329;font-weight:900}#tvTimer{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5000;font-size:9rem;font-weight:900;color:#fff5e9;text-shadow:0 0 30px #ff9a3c;display:none}
@media(max-width:800px){#board{grid-template-columns:1fr}h1{font-size:2.4rem}#question{font-size:1.8rem}}
</style>
</head>
<body>
<div id="soundSetup"><div id="soundCard"><h2>🔊 Enable Halloween Sound</h2><p>Press this once with the TV remote. The tablet can then start the 15-second spooky timer through the TV speakers.</p><button id="enableSound">Enable TV Sound</button></div></div><div id="tvTimer"></div>
<audio id="timerMusic" preload="auto" src="spooky-halloween.mp3"></audio>
<audio id="screamSound" preload="auto" src="scary-scream.mp3"></audio>
<main>
<h1>🎃 Halloween Feud</h1>
<div class="scores">
  <div class="team" id="team0"><div class="name" id="name0">Team Ghosts</div><div class="score" id="score0">0</div></div>
  <div class="team" id="team1"><div class="name" id="name1">Team Pumpkins</div><div class="score" id="score1">0</div></div>
</div>
<p id="round"></p>
<h2 id="question"></h2>
<p id="bank"></p>
<div id="strikes"></div>
<p id="status"></p>
<div id="board"></div>
</main>
<div id="connection">Connecting…</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAmFE08f79oyGbenEQHHB0pRGFBO4Y-xkQ",
  authDomain: "halloween-fued.firebaseapp.com",
  databaseURL: "https://halloween-fued-default-rtdb.firebaseio.com",
  projectId: "halloween-fued",
  storageBucket: "halloween-fued.firebasestorage.app",
  messagingSenderId: "115514988678",
  appId: "1:115514988678:web:ed6f21b8980d34363f9907"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const gameRef = db.ref("games/party");
const timerRef = db.ref("games/party/timer");
const QUESTIONS = [
  {
    "question": "Name something that gets scarier the older you get.",
    "answers": [
      ["Getting older / birthdays", 28],
      ["Bills / money", 22],
      ["Doctors / health", 18],
      ["The mirror", 14],
      ["Hangovers", 10],
      ["Teenagers / kids", 8]
    ]
  },
  {
    "question": "Name something you might regret doing at a Halloween party.",
    "answers": [
      ["Drinking too much", 30],
      ["Texting an ex", 20],
      ["Bad dancing", 16],
      ["Kissing someone", 14],
      ["Posting pictures", 12],
      ["Wearing THAT costume", 8]
    ]
  },
  {
    "question": "Name something people think they're really good at after a few drinks.",
    "answers": [
      ["Dancing", 28],
      ["Singing", 22],
      ["Flirting", 18],
      ["Telling stories", 14],
      ["Giving advice", 10],
      ["Texting", 8]
    ]
  },
  {
    "question": "Name something embarrassing that could happen while wearing a Halloween costume.",
    "answers": [
      ["Costume rips", 26],
      ["Trip / fall", 22],
      ["Wardrobe malfunction", 18],
      ["Can't use the bathroom", 14],
      ["Lose part of the costume", 12],
      ["Someone wears the same costume", 8]
    ]
  },
  {
    "question": "Name a costume you'd question if your spouse said, ‘Don't worry, it's totally appropriate.’",
    "answers": [
      ["Sexy nurse", 24],
      ["Playboy bunny", 20],
      ["Stripper", 18],
      ["French maid", 16],
      ["Tarzan / Jane", 12],
      ["Anything with body paint", 10]
    ]
  },
  {
    "question": "Name something you might hear yelled at an adult Halloween party.",
    "answers": [
      ["Shots!", 28],
      ["Turn it up!", 20],
      ["Where's my drink?", 18],
      ["Take a picture!", 14],
      ["Who invited them?", 12],
      ["I need an Uber!", 8]
    ]
  },
  {
    "question": "Besides candy, name something adults hope to get on Halloween night.",
    "answers": [
      ["Drinks", 26],
      ["Get lucky", 22],
      ["A kiss", 18],
      ["Attention", 14],
      ["Food", 12],
      ["A phone number", 8]
    ]
  },
  {
    "question": "Name something that could make you say, ‘I'm NEVER drinking that again!’",
    "answers": [
      ["Tequila", 28],
      ["Fireball", 22],
      ["Mystery punch", 18],
      ["Shots", 14],
      ["Too much wine", 10],
      ["Jell-O shots", 8]
    ]
  }
];

const $ = id => document.getElementById(id);
let state = {round:0,scores:[0,0],controller:0,strikes:0,revealed:[],bank:0,phase:"play",winner:null};
let names = ["Team Ghosts","Team Pumpkins"];

function teamName(i){ return (names[i] || ("Team " + (i+1))).trim(); }

function render(){
  const q = QUESTIONS[state.round] || QUESTIONS[0];
  const settled = state.phase === "settled";
  const stealing = state.phase === "steal";
  const active = settled ? state.winner : (stealing ? 1-state.controller : state.controller);

  for(let i=0;i<2;i++){
    $("score"+i).textContent = state.scores[i] || 0;
    $("name"+i).textContent = teamName(i);
    $("team"+i).classList.toggle("active", active === i);
  }
  $("round").textContent = "Round " + (state.round+1) + " of " + QUESTIONS.length;
  $("question").textContent = q.question;
  $("bank").textContent = "Round points: " + (state.bank || 0);
  $("strikes").textContent = "❌ ".repeat(state.strikes || 0);

  if(settled){
    let msg = teamName(state.winner) + " wins " + state.bank + " points!";
    if(state.round === QUESTIONS.length-1){
      const a=state.scores[0], b=state.scores[1];
      msg += a===b ? " The game ends in a tie!" : " " + teamName(a>b?0:1) + " wins the game!";
    }
    $("status").textContent = msg;
  } else if(stealing){
    $("status").textContent = teamName(active) + ": one guess to steal!";
  } else {
    $("status").textContent = teamName(active) + " is playing.";
  }

  const board = $("board");
  while(board.firstChild) board.removeChild(board.firstChild);
  q.answers.forEach(function(pair,index){
    const shown = (state.revealed || []).indexOf(index) !== -1;
    const row = document.createElement("div");
    row.className = "answer" + (shown ? " revealed" : "");
    const text = document.createElement("span");
    const score = document.createElement("span");
    text.textContent = shown ? pair[0] : "Answer " + (index+1);
    score.textContent = shown ? pair[1] : "🎃";
    row.appendChild(text); row.appendChild(score); board.appendChild(row);
  });
}

let timerInterval=null,lastTimerCommand=0;
const timerMusic=$('timerMusic'),screamSound=$('screamSound');

function stopMusic(){
  try{timerMusic.pause();timerMusic.currentTime=0;}catch(e){}
}
function playMusic(){
  stopMusic();
  timerMusic.volume=0.8;
  const p=timerMusic.play();
  if(p&&p.catch)p.catch(function(e){console.log('Timer music blocked:',e);});
}
function playScream(){
  try{screamSound.pause();screamSound.currentTime=0;screamSound.volume=1.0;const p=screamSound.play();if(p&&p.catch)p.catch(function(e){console.log('Scream blocked:',e);});}catch(e){}
}
function stopTvTimer(){
  stopMusic();
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
  $('tvTimer').style.display='none';
}
function runTvTimer(endsAt){
  stopTvTimer();
  playMusic();
  function tick(){
    const ms=endsAt-Date.now(),left=Math.max(0,Math.ceil(ms/1000));
    $('tvTimer').textContent=left;
    $('tvTimer').style.display='block';
    if(ms<=0){
      if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
      stopMusic();
      $('tvTimer').textContent='TIME!';
      $('tvTimer').style.display='block';
      playScream();
      setTimeout(function(){$('tvTimer').style.display='none';},3200);
    }
  }
  tick();timerInterval=setInterval(tick,100);
}

$('enableSound').onclick=function(){
  // Prime both audio elements during the TV remote click so Fire TV Silk will allow later playback.
  timerMusic.volume=0.01;
  const p1=timerMusic.play();
  if(p1&&p1.then)p1.then(function(){timerMusic.pause();timerMusic.currentTime=0;timerMusic.volume=0.8;}).catch(function(){});
  screamSound.volume=0.01;
  const p2=screamSound.play();
  if(p2&&p2.then)p2.then(function(){screamSound.pause();screamSound.currentTime=0;screamSound.volume=1.0;}).catch(function(){});
  $('soundSetup').style.display='none';
  localStorage.setItem('halloweenFeudSoundEnabled','1');
};
// Browsers still require a real user gesture after a fresh TV/browser session, so show the button each new page load.
timerRef.on('value',function(snapshot){const t=snapshot.val()||{};if(!t.commandId||t.commandId===lastTimerCommand)return;lastTimerCommand=t.commandId;if(t.status==='running'&&t.endsAt>Date.now()){runTvTimer(t.endsAt);}else if(t.status==='stopped'){stopTvTimer();}});

gameRef.on("value", function(snapshot){
  if(!snapshot.exists()){
    $("connection").textContent = "Waiting for host…";
    return;
  }
  const v = snapshot.val() || {};
  if(v.state) state = v.state;
  if(v.names) names = v.names;
  render();
  $("connection").textContent = "Live";
}, function(){
  $("connection").textContent = "Connection error";
});

render();
</script>
</body>
</html>
