<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halloween Jeopardy TV</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#140d20;color:#fff5e9;font-family:system-ui}main{max-width:1100px;margin:auto}h1,h2,p{text-align:center}h1{color:#ff9a3c}.code{text-align:center;color:#ffbf69;font-size:1.35rem;font-weight:900}.scores{display:flex;gap:12px}.team{flex:1;padding:12px;border:2px solid #64477c;border-radius:16px;text-align:center;background:#251737}.team.active{border-color:#ff9a3c}.score{font-size:2.5rem;font-weight:900}button{padding:11px 14px;border:0;border-radius:10px;background:#ff9a3c;color:#241329;font-weight:800;margin:4px}.controls{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:12px}.joinbox{text-align:center;background:#251737;border:2px solid #64477c;border-radius:16px;padding:10px;margin:12px auto}.joinbox img{width:150px;height:150px;background:white;padding:5px}.winner{font-size:1.4rem;color:#83d4b7;font-weight:900;text-align:center}.red{background:#ff6464}button:disabled{opacity:.4}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:14px 0}.cat,.clue{text-align:center;border-radius:8px;padding:8px 4px;font-weight:900}.cat{background:#392451;min-height:65px}.clue{background:#ff9a3c;color:#241329;border:0;font-size:1.3rem;min-height:60px}.clue:disabled{background:#33283a;color:#786b80}.panel{background:#251737;border:2px solid #64477c;border-radius:18px;padding:18px;text-align:center}.hidden{display:none}.answer{color:#83d4b7;font-size:1.4rem;font-weight:900}input{width:100%;background:transparent;color:white;border:0;text-align:center;font-size:1.15rem}#join{position:fixed;inset:0;background:radial-gradient(circle at top,#321442,#0d0712 70%);display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px}#join>div{width:min(560px,92vw);padding:34px 24px;background:#251737;border:3px solid #ff9a3c;border-radius:24px;box-shadow:0 0 35px #9b5de566;text-align:center}#join h1{font-size:clamp(2rem,6vw,3.5rem);margin:0 0 12px}#join .joinprompt{font-size:1.35rem;font-weight:900;margin:8px 0 14px}#join input{display:block;font-size:2.4rem;width:220px;max-width:80%;height:68px;margin:0 auto 14px;text-align:center;background:#fff;color:#241329;border:4px solid #ff9a3c;border-radius:14px;font-weight:900;letter-spacing:.18em}#join button{font-size:1.45rem;padding:15px 30px;min-width:160px}.overlay{position:fixed;inset:0;background:#140d20;display:none;align-items:center;justify-content:center;padding:40px;z-index:10}.card{max-width:1100px;text-align:center}#buzzwin{font-size:2.2rem}#tvbar{text-align:center}.qrmini{width:82px;height:82px;background:#fff;padding:3px}</style></head><body><div id="join"><div><h1>💀 Halloween Jeopardy TV</h1><div class="joinprompt">Enter the 4-digit game code</div><input id="jc" maxlength="4" inputmode="numeric" placeholder="0000" aria-label="4-digit game code"><button onclick="joinGame()">JOIN GAME</button></div></div><main><h1>💀 Halloween Jeopardy</h1><div id="tvbar"><button onclick="home()">🏠 Home</button> <b>ROOM: <span id="roomcode"></span></b><br><img id="guestqr" class="qrmini"></div><div id="buzzwin" class="winner"></div><div class="scores"><div id="t0" class="team"><div id="n0"></div><div id="s0" class="score"></div></div><div id="t1" class="team"><div id="n1"></div><div id="s1" class="score"></div></div></div><div id="board" class="board"></div><p id="result"></p></main><div id="ov" class="overlay"><div class="card"><div id="deal"></div><h2 id="q"></h2><div id="a" class="answer"></div></div></div><script>
const DB="https://halloween-fued-default-rtdb.firebaseio.com";
const clean=v=>String(v||"").replace(/\D/g,"").slice(0,4);
const code=()=>String(Math.floor(1000+Math.random()*9000));
async function req(path,method="GET",body,headers={}){
 const r=await fetch(DB+"/"+path+".json",{method,headers:{"Content-Type":"application/json",...headers},
 body:body===undefined?undefined:JSON.stringify(body),cache:"no-store"});
 if(!r.ok) throw Error("Firebase "+r.status);
 return r.json();
}
function hostCode(game){
 const qp=clean(new URLSearchParams(location.search).get("room"));
 let k="sanders:"+game+":host",c=qp||clean(sessionStorage.getItem(k));
 if(c.length!==4)c=code(); sessionStorage.setItem(k,c); return c;
}
function home(){location.href="../"}
function guestUrl(game,room){return location.origin+"/guest.html?game="+encodeURIComponent(game)+"&room="+room}
function qrUrl(game,room){return "https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data="+encodeURIComponent(guestUrl(game,room))}

const C=[["🎬 SCARY MOVIES", [["In Hocus Pocus, what kind of women are the Sanderson sisters?", "Witches"], ["What masked killer stalks his victims in the Halloween movies?", "Michael Myers"], ["In Beetlejuice, say his name this many times and he appears.", "Three"], ["What hotel is the setting for The Shining?", "The Overlook Hotel"]]], ["🍸 BOOS & BOOZE", [["This spirit is the main alcohol in a classic margarita.", "Tequila"], ["A Bloody Mary is traditionally made with this liquor.", "Vodka"], ["This cinnamon-flavored whiskey is practically made for a Halloween shot.", "Fireball"], ["A traditional Dark ’n’ Stormy combines ginger beer with this spirit.", "Dark rum"]]], ["🧛 MONSTERS & MAYHEM", [["According to legend, this creature transforms during a full moon.", "Werewolf"], ["This is the one thing Dracula definitely does not want on his garlic bread.", "Garlic"], ["Frankenstein is actually the name of this person, not the monster.", "Victor Frankenstein / the doctor"], ["In Greek mythology, Medusa had these instead of hair.", "Snakes"]]], ["🎃 HALLOWEEN STUFF", [["What vegetable do Americans traditionally carve into jack-o’-lanterns?", "Pumpkin"], ["What two colors are most associated with Halloween?", "Orange and black"], ["Before pumpkins became popular, jack-o’-lanterns in Ireland were commonly carved from this root vegetable.", "Turnips"], ["Halloween traces much of its tradition to this ancient Celtic festival.", "Samhain"]]], ["😈 NAUGHTY OR FRIGHT", [["Complete the pickup line: “Are you a ghost? Because you’ve been _____ me all night.”", "Haunting"], ["This classic costume only needs ears, a tail, and maybe a little black dress.", "A cat / black cat"], ["If someone goes upstairs at the Halloween party to “look at the costumes,” everyone assumes they are probably doing this instead.", "Making out / hooking up"], ["This term for waking up after a wild night with little or no memory of what happened is something you definitely do not want at your Halloween party.", "Blackout"]]]],FINAL=["This 1975 cult musical horror comedy features Dr. Frank-N-Furter.","The Rocky Horror Picture Show"],$=x=>document.getElementById(x);let PATH="",gen=0;
function render(v){let st=v.state,n=v.names||["Team Ghosts","Team Pumpkins"];for(let i=0;i<2;i++){$("n"+i).textContent=n[i];$("s"+i).textContent=st.scores[i];$("t"+i).classList.toggle("active",st.team===i)}$("buzzwin").textContent=v.phone?.buzz?(v.phone.buzz.team===0?"👻 TEAM GHOSTS BUZZED FIRST!":"🎃 TEAM PUMPKINS BUZZED FIRST!"):"";let b=$("board");b.innerHTML="";C.forEach(c=>{let d=document.createElement("div");d.className="cat";d.textContent=c[0];b.appendChild(d)});for(let r=0;r<4;r++)for(let c=0;c<5;c++){let k=c+"-"+r,d=document.createElement("div");d.className="clue";d.textContent=(st.used||{})[k]?"":"$"+((r+1)*100);b.appendChild(d)}$("result").textContent=st.final?.done?(st.scores[0]===st.scores[1]?"☠️ Final Fright ends in a tie!":"🎉 "+n[st.scores[0]>st.scores[1]?0:1]+" wins Final Fright!"):"";if(st.current){let x=st.current.final?FINAL:C[st.current.c][1][st.current.r];$("ov").style.display="flex";$("deal").textContent=st.current.final?"☠️ FINAL FRIGHT — Til Death Do Us Party":st.current.deal?"😈 DEVIL'S DEAL 😈":"";$("q").textContent=x[0];$("a").textContent=st.showAnswer?x[1]:""}else $("ov").style.display="none"}
async function poll(t){try{const v=await req(PATH);if(t===gen&&v?.state)render(v)}finally{if(t===gen)setTimeout(()=>poll(t),650)}}function joinGame(){let c=clean($("jc").value);if(c.length!==4)return alert("Enter 4 digits");PATH="games/jeopardy/"+c;$("roomcode").textContent=c;$("guestqr").src=qrUrl("jeopardy",c);localStorage.setItem("sanders:jeopardy:tv",c);$("join").style.display="none";poll(++gen)}$("jc").onkeydown=e=>{if(e.key==="Enter")joinGame()};const remembered=clean(localStorage.getItem("sanders:jeopardy:tv"));if(remembered.length===4)$("jc").value=remembered;
</script></body></html>
