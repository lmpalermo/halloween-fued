<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halloween Jeopardy TV</title><style>*{box-sizing:border-box}body{margin:0;background:#140d20;color:#fff5e9;font-family:system-ui;padding:14px}main{max-width:1150px;margin:auto}h1{text-align:center;color:#ff9a3c}.code{text-align:center;color:#ffbf69;font-size:1.3rem;font-weight:900}.scores{display:flex;gap:12px}.team{flex:1;background:#251737;border:2px solid #64477c;border-radius:15px;padding:10px;text-align:center}.team.active{border-color:#ff9a3c}.team input{width:100%;background:transparent;border:0;color:white;text-align:center;font-size:1.15rem}.score{font-size:2.3rem;font-weight:900}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:14px 0}.cat,.clue{min-width:0;text-align:center;border-radius:8px;padding:8px 4px;font-weight:900}.cat{background:#392451;min-height:65px}.clue{background:#ff9a3c;color:#241329;border:0;font-size:1.3rem;min-height:60px}.clue:disabled{background:#33283a;color:#786b80}.controls{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.panel{background:#251737;border:2px solid #64477c;border-radius:18px;padding:18px;text-align:center}.hidden{display:none}.answer{color:#83d4b7;font-size:1.4rem;font-weight:900}button{padding:11px 14px;border:0;border-radius:10px;background:#ff9a3c;color:#241329;font-weight:800}#join{position:fixed;inset:0;z-index:99999;background:#140d20;display:flex;align-items:center;justify-content:center}#join .joincard{width:min(560px,92vw);padding:28px;text-align:center;background:#251737;border:3px solid #ff9a3c;border-radius:22px}#join input{font-size:2.3rem;width:190px;text-align:center;letter-spacing:.28em;padding:10px;border-radius:12px}button{cursor:pointer}.overlay{position:fixed;inset:0;background:#140d20;display:none;align-items:center;justify-content:center;padding:40px;z-index:10}.card{max-width:1100px;text-align:center}.card h2{font-size:3rem}</style></head><body>
<div id="join"><div class="joincard"><h1>💀 Halloween Jeopardy</h1><h2>📺 Join Game</h2><p>Enter the 4-digit Game Code shown on the host tablet.</p>
<input id="jc" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="1234"><br>
<button onclick="joinGame()">JOIN GAME</button><button onclick="home()">🏠 Game Night Home</button></div></div>
<main><h1>💀 Halloween Jeopardy</h1><div class="scores"><div id="t0" class="team"><div id="n0"></div><div id="s0" class="score"></div></div><div id="t1" class="team"><div id="n1"></div><div id="s1" class="score"></div></div></div><div id="board" class="board"></div></main><div id="ov" class="overlay"><div class="card"><div id="deal"></div><h2 id="q"></h2><div id="a" class="answer"></div></div></div><script>
const DB="https://halloween-fued-default-rtdb.firebaseio.com";
const code=()=>String(Math.floor(1000+Math.random()*9000));
const clean=v=>String(v||"").replace(/\D/g,"").slice(0,4);
async function req(path,method="GET",body){
 const r=await fetch(DB+"/"+path+".json",{method,headers:{"Content-Type":"application/json"},body:body===undefined?undefined:JSON.stringify(body),cache:"no-store"});
 if(!r.ok)throw Error("Firebase "+r.status); return r.json();
}
function hostCode(game){let k="sanders:"+game+":host",c=clean(sessionStorage.getItem(k));if(c.length!==4){c=code();sessionStorage.setItem(k,c)}return c}
function home(){location.href="../"}

const C=[["🎬 SCARY MOVIES", [["In Hocus Pocus, what kind of women are the Sanderson sisters?", "Witches"], ["What masked killer stalks his victims in the Halloween movies?", "Michael Myers"], ["In Beetlejuice, say his name this many times and he appears.", "Three"], ["What hotel is the setting for The Shining?", "The Overlook Hotel"]]], ["🍸 BOOS & BOOZE", [["This spirit is the main alcohol in a classic margarita.", "Tequila"], ["A Bloody Mary is traditionally made with this liquor.", "Vodka"], ["This cinnamon-flavored whiskey is practically made for a Halloween shot.", "Fireball"], ["A traditional Dark ’n’ Stormy combines ginger beer with this spirit.", "Dark rum"]]], ["🧛 MONSTERS & MAYHEM", [["According to legend, this creature transforms during a full moon.", "Werewolf"], ["This is the one thing Dracula definitely does not want on his garlic bread.", "Garlic"], ["Frankenstein is actually the name of this person, not the monster.", "Victor Frankenstein / the doctor"], ["In Greek mythology, Medusa had these instead of hair.", "Snakes"]]], ["🎃 HALLOWEEN STUFF", [["What vegetable do Americans traditionally carve into jack-o’-lanterns?", "Pumpkin"], ["What two colors are most associated with Halloween?", "Orange and black"], ["Before pumpkins became popular, jack-o’-lanterns in Ireland were commonly carved from this root vegetable.", "Turnips"], ["Halloween traces much of its tradition to this ancient Celtic festival.", "Samhain"]]], ["😈 NAUGHTY OR FRIGHT", [["Complete the pickup line: “Are you a ghost? Because you’ve been _____ me all night.”", "Haunting"], ["This classic costume only needs ears, a tail, and maybe a little black dress.", "A cat / black cat"], ["If someone goes upstairs at the Halloween party to “look at the costumes,” everyone assumes they are probably doing this instead.", "Making out / hooking up"], ["This term for waking up after a wild night with little or no memory of what happened is something you definitely do not want at your Halloween party.", "Blackout"]]]];const $=x=>document.getElementById(x);let PATH="",poller;function render(v){let st=v.state,n=v.names;for(let i=0;i<2;i++){$("n"+i).textContent=n[i];$("s"+i).textContent=st.scores[i];$("t"+i).classList.toggle("active",st.team===i)}let b=$("board");b.innerHTML="";C.forEach(c=>{let d=document.createElement("div");d.className="cat";d.textContent=c[0];b.appendChild(d)});for(let r=0;r<4;r++)for(let c=0;c<5;c++){let k=c+"-"+r,d=document.createElement("div");d.className="clue";d.textContent=st.used[k]?"":"$"+((r+1)*100);b.appendChild(d)}if(st.current){let x=C[st.current.c][1][st.current.r];$("ov").style.display="flex";$("deal").textContent=st.current.deal?"😈 DEVIL'S DEAL 😈":"";$("q").textContent=x[0];$("a").textContent=st.showAnswer?x[1]:""}else $("ov").style.display="none"}async function poll(){let v=await req(PATH);if(v)render(v)}function joinGame(){let c=clean($("jc").value);if(c.length!==4)return alert("Enter all 4 numbers.");PATH="games/jeopardy/"+c;$("join").style.display="none";poll();poller=setInterval(poll,700)}
</script></body></html>
