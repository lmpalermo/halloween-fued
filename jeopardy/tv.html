<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halloween Jeopardy TV</title><style>*{box-sizing:border-box}body{margin:0;background:#140d20;color:#fff5e9;font-family:system-ui,sans-serif;padding:18px}main{max-width:1500px;margin:auto}h1{text-align:center;color:#ff9a3c;font-size:3rem}.scores{display:flex;gap:18px}.team{flex:1;background:#251737;border:3px solid #64477c;border-radius:18px;padding:12px;text-align:center}.team.active{border-color:#ff9a3c}.score{font-size:3rem;font-weight:900}.name{font-size:1.4rem;font-weight:800}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:20px}.cat,.clue{display:flex;align-items:center;justify-content:center;text-align:center;border-radius:10px;font-weight:900}.cat{background:#392451;min-height:85px;font-size:1.15rem}.clue{background:#ff9a3c;color:#241329;min-height:95px;font-size:2rem}.used{background:#251737;color:#4c3e54}.overlay{position:fixed;inset:0;background:#140d20;display:none;align-items:center;justify-content:center;padding:40px;z-index:10}.card{max-width:1100px;text-align:center}.card h2{font-size:3rem}.ans{font-size:2.2rem;color:#83d4b7;font-weight:900}.deal{font-size:4rem;color:#ff9a3c;font-weight:900}</style></head><body><main><h1>💀 Halloween Jeopardy</h1><div class="scores"><div id="t0" class="team"><div id="n0" class="name"></div><div id="s0" class="score"></div></div><div id="t1" class="team"><div id="n1" class="name"></div><div id="s1" class="score"></div></div></div><div id="board" class="board"></div></main><div id="overlay" class="overlay"><div class="card"><div id="deal" class="deal"></div><h2 id="q"></h2><div id="a" class="ans"></div></div></div><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script>
const firebaseConfig={apiKey:"AIzaSyAmFE08f79oyGbenEQHHB0pRGFBO4Y-xkQ",authDomain:"halloween-fued.firebaseapp.com",databaseURL:"https://halloween-fued-default-rtdb.firebaseio.com",projectId:"halloween-fued",storageBucket:"halloween-fued.firebasestorage.app",messagingSenderId:"115514988678",appId:"1:115514988678:web:ed6f21b8980d34363f9907"};firebase.initializeApp(firebaseConfig);const ref=firebase.database().ref('games/jeopardy');const C=[['🎬 SCARY MOVIES',[['In Hocus Pocus, what kind of women are the Sanderson sisters?','Witches'],['What masked killer stalks his victims in the Halloween movies?','Michael Myers'],['In Beetlejuice, say his name this many times and he appears.','Three'],['What hotel is the setting for The Shining?','The Overlook Hotel']]],['🍸 BOOS & BOOZE',[['This spirit is the main alcohol in a classic margarita.','Tequila'],['A Bloody Mary is traditionally made with this liquor.','Vodka'],['This cinnamon-flavored whiskey is practically made for a Halloween shot.','Fireball'],['A traditional Dark ’n’ Stormy combines ginger beer with this spirit.','Dark rum']]],['🧛 MONSTERS & MAYHEM',[['According to legend, this creature transforms during a full moon.','Werewolf'],['This is the one thing Dracula definitely does not want on his garlic bread.','Garlic'],['Frankenstein is actually the name of this person, not the monster.','Victor Frankenstein / the doctor'],['In Greek mythology, Medusa had these instead of hair.','Snakes']]],['🎃 HALLOWEEN STUFF',[['What vegetable do Americans traditionally carve into jack-o’-lanterns?','Pumpkin'],['What two colors are most associated with Halloween?','Orange and black'],['Before pumpkins became popular, jack-o’-lanterns in Ireland were commonly carved from this root vegetable.','Turnips'],['Halloween traces much of its tradition to this ancient Celtic festival.','Samhain']]],['😈 NAUGHTY OR FRIGHT',[['Complete the pickup line: “Are you a ghost? Because you’ve been _____ me all night.”','Haunting'],['This classic costume only needs ears, a tail, and maybe a little black dress.','A cat / black cat'],['If someone goes upstairs at the Halloween party to “look at the costumes,” everyone assumes they are probably doing this instead.','Making out / hooking up'],['This term for waking up after a wild night with little or no memory of what happened is something you definitely do not want at your Halloween party.','Blackout']]]];const $=x=>document.getElementById(x);function render(v){let st=v.state||{scores:[0,0],team:0,used:{},current:null,showAnswer:false},names=v.names||['Team Ghosts','Team Pumpkins'];for(let i=0;i<2;i++){$('n'+i).textContent=names[i];$('s'+i).textContent=st.scores[i]||0;$('t'+i).classList.toggle('active',st.team===i)}let b=$('board');b.innerHTML='';C.forEach(c=>{let d=document.createElement('div');d.className='cat';d.textContent=c[0];b.appendChild(d)});for(let r=0;r<4;r++)for(let c=0;c<5;c++){let k=c+'-'+r,d=document.createElement('div');d.className='clue'+(st.used[k]?' used':'');d.textContent=st.used[k]?'':'$'+((r+1)*100);b.appendChild(d)}if(st.current){let x=C[st.current.c][1][st.current.r];$('overlay').style.display='flex';$('deal').textContent=st.current.deal?'😈 DEVIL’S DEAL 😈':'';$('q').textContent=x[0];$('a').textContent=st.showAnswer?x[1]:''}else $('overlay').style.display='none'}ref.on('value',s=>{if(s.exists())render(s.val())});render({});</script></body></html>
