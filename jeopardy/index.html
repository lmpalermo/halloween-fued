<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halloween Jeopardy</title><style>*{box-sizing:border-box}body{margin:0;background:#140d20;color:#fff5e9;font-family:system-ui,sans-serif;padding:18px}main{max-width:1100px;margin:auto}h1{text-align:center;color:#ff9a3c}.scores{display:flex;gap:12px}.team{flex:1;background:#251737;border:2px solid #64477c;border-radius:15px;padding:12px;text-align:center}.team.active{border-color:#ff9a3c}.team input{width:100%;background:transparent;border:0;color:white;text-align:center;font-size:1.2rem;font-weight:700}.score{font-size:2.4rem;font-weight:900}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:18px 0}.cat,.clue{min-width:0;text-align:center;border-radius:8px;padding:10px 5px;font-weight:900}.cat{background:#392451;color:#fff;font-size:.85rem;min-height:68px;display:flex;align-items:center;justify-content:center}.clue{background:#ff9a3c;color:#241329;border:0;font-size:1.35rem;min-height:64px}.clue:disabled{background:#33283a;color:#786b80}.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}button,a.btn{border:0;border-radius:10px;padding:12px 15px;background:#ff9a3c;color:#241329;font-weight:800;text-decoration:none}.panel{background:#251737;border:2px solid #64477c;border-radius:18px;padding:20px;text-align:center;margin:15px 0}.panel h2{font-size:1.6rem}.answer{color:#83d4b7;font-size:1.4rem;font-weight:900}.hidden{display:none}#sync{text-align:center;color:#83d4b7}@media(max-width:700px){.board{gap:3px}.cat{font-size:.62rem;padding:5px 2px}.clue{font-size:.9rem;padding:5px 2px;min-height:52px}}</style></head><body><main><h1>💀 Halloween Jeopardy</h1><div class="scores"><div class="team active" id="t0"><input id="n0" value="Team Ghosts"><div class="score" id="s0">0</div></div><div class="team" id="t1"><input id="n1" value="Team Pumpkins"><div class="score" id="s1">0</div></div></div><div id="board" class="board"></div><section id="panel" class="panel hidden"><div id="deal" class="hidden">😈 DEVIL'S DEAL 😈</div><h2 id="clueText"></h2><p id="answer" class="answer hidden"></p><div class="controls"><button id="reveal">Reveal Answer</button><button id="correct">✓ Correct</button><button id="wrong">✕ Wrong</button><button id="close">Back to Board</button></div></section><div class="controls"><button id="switch">Switch Team</button><button id="final">☠️ Final Fright</button><button id="reset">New Game</button><a class="btn" href="../">🏠 Game Night Home</a></div><p id="sync">Firebase: connecting…</p></main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script>
const firebaseConfig={apiKey:"AIzaSyAmFE08f79oyGbenEQHHB0pRGFBO4Y-xkQ",authDomain:"halloween-fued.firebaseapp.com",databaseURL:"https://halloween-fued-default-rtdb.firebaseio.com",projectId:"halloween-fued",storageBucket:"halloween-fued.firebasestorage.app",messagingSenderId:"115514988678",appId:"1:115514988678:web:ed6f21b8980d34363f9907"};firebase.initializeApp(firebaseConfig);const ref=firebase.database().ref('games/jeopardy');
const C=[['🎬 SCARY MOVIES',[['In Hocus Pocus, what kind of women are the Sanderson sisters?','Witches'],['What masked killer stalks his victims in the Halloween movies?','Michael Myers'],['In Beetlejuice, say his name this many times and he appears.','Three'],['What hotel is the setting for The Shining?','The Overlook Hotel']]],['🍸 BOOS & BOOZE',[['This spirit is the main alcohol in a classic margarita.','Tequila'],['A Bloody Mary is traditionally made with this liquor.','Vodka'],['This cinnamon-flavored whiskey is practically made for a Halloween shot.','Fireball'],['A traditional Dark ’n’ Stormy combines ginger beer with this spirit.','Dark rum']]],['🧛 MONSTERS & MAYHEM',[['According to legend, this creature transforms during a full moon.','Werewolf'],['This is the one thing Dracula definitely does not want on his garlic bread.','Garlic'],['Frankenstein is actually the name of this person, not the monster.','Victor Frankenstein / the doctor'],['In Greek mythology, Medusa had these instead of hair.','Snakes']]],['🎃 HALLOWEEN STUFF',[['What vegetable do Americans traditionally carve into jack-o’-lanterns?','Pumpkin'],['What two colors are most associated with Halloween?','Orange and black'],['Before pumpkins became popular, jack-o’-lanterns in Ireland were commonly carved from this root vegetable.','Turnips'],['Halloween traces much of its tradition to this ancient Celtic festival.','Samhain']]],['😈 NAUGHTY OR FRIGHT',[['Complete the pickup line: “Are you a ghost? Because you’ve been _____ me all night.”','Haunting'],['This classic costume only needs ears, a tail, and maybe a little black dress.','A cat / black cat'],['If someone goes upstairs at the Halloween party to “look at the costumes,” everyone assumes they are probably doing this instead.','Making out / hooking up'],['This term for waking up after a wild night with little or no memory of what happened is something you definitely do not want at your Halloween party.','Blackout']]]];
let st={scores:[0,0],team:0,used:{},current:null,showAnswer:false,final:false};let names=['Team Ghosts','Team Pumpkins'];const $=x=>document.getElementById(x);const dealKeys={'1-2':1,'4-3':1};function save(){return ref.set({state:st,names:names,updatedAt:firebase.database.ServerValue.TIMESTAMP});}function render(){for(let i=0;i<2;i++){$('s'+i).textContent=st.scores[i];$('t'+i).classList.toggle('active',st.team===i);$('n'+i).value=names[i];}let b=$('board');b.innerHTML='';C.forEach(c=>{let d=document.createElement('div');d.className='cat';d.textContent=c[0];b.appendChild(d)});for(let r=0;r<4;r++)for(let c=0;c<5;c++){let k=c+'-'+r,bt=document.createElement('button');bt.className='clue';bt.textContent='$'+((r+1)*100);bt.disabled=!!st.used[k];bt.onclick=()=>openClue(c,r);b.appendChild(bt)}if(st.current){let q=C[st.current.c][1][st.current.r];$('panel').classList.remove('hidden');$('clueText').textContent=q[0];$('answer').textContent=q[1];$('answer').classList.toggle('hidden',!st.showAnswer);$('deal').classList.toggle('hidden',!st.current.deal);}else $('panel').classList.add('hidden');}
function openClue(c,r){let k=c+'-'+r;st.used[k]=true;st.current={c:c,r:r,value:(r+1)*100,deal:!!dealKeys[k]};st.showAnswer=false;save();render()}$('reveal').onclick=()=>{st.showAnswer=true;save();render()};$('correct').onclick=()=>{if(!st.current)return;st.scores[st.team]+=st.current.value;st.current=null;st.showAnswer=false;st.team=1-st.team;save();render()};$('wrong').onclick=()=>{if(!st.current)return;st.scores[st.team]-=st.current.value;st.team=1-st.team;save();render()};$('close').onclick=()=>{st.current=null;st.showAnswer=false;save();render()};$('switch').onclick=()=>{st.team=1-st.team;save();render()};$('final').onclick=()=>{alert('☠️ FINAL FRIGHT\nCategory: Til Death Do Us Party\n\nClue: This 1975 cult musical horror comedy features a sweet transvestite scientist named Dr. Frank-N-Furter.\n\nAnswer: The Rocky Horror Picture Show');};$('reset').onclick=()=>{if(confirm('Start a new Jeopardy game?')){st={scores:[0,0],team:0,used:{},current:null,showAnswer:false,final:false};save();render()}};['n0','n1'].forEach((id,i)=>{$(id).oninput=e=>{names[i]=e.target.value;save()}});ref.once('value').then(s=>{if(s.exists()){let v=s.val();if(v.state)st=v.state;if(v.names)names=v.names}else save();$('sync').textContent='Firebase: connected ✓';render()}).catch(()=>{$('sync').textContent='Firebase: connection error'});render();
</script></body></html>
