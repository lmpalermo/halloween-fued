<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halloween Jeopardy</title><style>*{box-sizing:border-box}body{margin:0;background:#140d20;color:#fff5e9;font-family:system-ui;padding:14px}main{max-width:1150px;margin:auto}h1{text-align:center;color:#ff9a3c}.code{text-align:center;color:#ffbf69;font-size:1.3rem;font-weight:900}.scores{display:flex;gap:12px}.team{flex:1;background:#251737;border:2px solid #64477c;border-radius:15px;padding:10px;text-align:center}.team.active{border-color:#ff9a3c}.team input{width:100%;background:transparent;border:0;color:white;text-align:center;font-size:1.15rem}.score{font-size:2.3rem;font-weight:900}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:14px 0}.cat,.clue{min-width:0;text-align:center;border-radius:8px;padding:8px 4px;font-weight:900}.cat{background:#392451;min-height:65px}.clue{background:#ff9a3c;color:#241329;border:0;font-size:1.3rem;min-height:60px}.clue:disabled{background:#33283a;color:#786b80}.controls{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.panel{background:#251737;border:2px solid #64477c;border-radius:18px;padding:18px;text-align:center}.hidden{display:none}.answer{color:#83d4b7;font-size:1.4rem;font-weight:900}button{padding:11px 14px;border:0;border-radius:10px;background:#ff9a3c;color:#241329;font-weight:800}button:disabled{opacity:.4;cursor:default}.team{min-width:0}.answer span{overflow-wrap:anywhere}@media(max-width:650px){.board{gap:3px}.cat{font-size:12px}.clue{font-size:18px;padding:8px 2px}}
</style></head><body><main><h1>💀 Halloween Jeopardy</h1><div class="code">GAME CODE: <span id="gc"></span></div><div class="controls"><button onclick="home()">🏠 Game Night Home</button></div><div class="scores"><div id="t0" class="team"><input id="n0" value="Team Ghosts"><div id="s0" class="score">0</div></div><div id="t1" class="team"><input id="n1" value="Team Pumpkins"><div id="s1" class="score">0</div></div></div><div id="board" class="board"></div><section id="panel" class="panel hidden"><div id="deal"></div><h2 id="q"></h2><p id="a" class="answer hidden"></p><div class="controls"><button onclick="reveal()">Reveal Answer</button><button onclick="correct()">✓ Correct</button><button onclick="wrong()">✕ Wrong</button><button onclick="closeClue()">Back to Board</button></div></section><div class="controls"><button onclick="switchTeam()">Switch Team</button><button onclick="finalFright()">☠️ Final Fright</button><button onclick="resetGame()">New Game</button></div><p id="result" role="status"></p><p id="sync" role="status">Connecting…</p></main><script>
const DB="https://halloween-fued-default-rtdb.firebaseio.com";
const code=()=>String(Math.floor(1000+Math.random()*9000));
const clean=v=>String(v||"").replace(/\D/g,"").slice(0,4);
async function req(path,method="GET",body){
 const r=await fetch(DB+"/"+path+".json",{method,headers:{"Content-Type":"application/json"},body:body===undefined?undefined:JSON.stringify(body),cache:"no-store"});
 if(!r.ok)throw Error("Firebase "+r.status); return r.json();
}
function hostCode(game){let k="sanders:"+game+":host",c=clean(sessionStorage.getItem(k));if(c.length!==4){c=code();sessionStorage.setItem(k,c)}return c}
function home(){location.href="../"}

const GAME="jeopardy",ROOM=hostCode(GAME),PATH="games/jeopardy/"+ROOM,C=[["🎬 SCARY MOVIES", [["In Hocus Pocus, what kind of women are the Sanderson sisters?", "Witches"], ["What masked killer stalks his victims in the Halloween movies?", "Michael Myers"], ["In Beetlejuice, say his name this many times and he appears.", "Three"], ["What hotel is the setting for The Shining?", "The Overlook Hotel"]]], ["🍸 BOOS & BOOZE", [["This spirit is the main alcohol in a classic margarita.", "Tequila"], ["A Bloody Mary is traditionally made with this liquor.", "Vodka"], ["This cinnamon-flavored whiskey is practically made for a Halloween shot.", "Fireball"], ["A traditional Dark ’n’ Stormy combines ginger beer with this spirit.", "Dark rum"]]], ["🧛 MONSTERS & MAYHEM", [["According to legend, this creature transforms during a full moon.", "Werewolf"], ["This is the one thing Dracula definitely does not want on his garlic bread.", "Garlic"], ["Frankenstein is actually the name of this person, not the monster.", "Victor Frankenstein / the doctor"], ["In Greek mythology, Medusa had these instead of hair.", "Snakes"]]], ["🎃 HALLOWEEN STUFF", [["What vegetable do Americans traditionally carve into jack-o’-lanterns?", "Pumpkin"], ["What two colors are most associated with Halloween?", "Orange and black"], ["Before pumpkins became popular, jack-o’-lanterns in Ireland were commonly carved from this root vegetable.", "Turnips"], ["Halloween traces much of its tradition to this ancient Celtic festival.", "Samhain"]]], ["😈 NAUGHTY OR FRIGHT", [["Complete the pickup line: “Are you a ghost? Because you’ve been _____ me all night.”", "Haunting"], ["This classic costume only needs ears, a tail, and maybe a little black dress.", "A cat / black cat"], ["If someone goes upstairs at the Halloween party to “look at the costumes,” everyone assumes they are probably doing this instead.", "Making out / hooking up"], ["This term for waking up after a wild night with little or no memory of what happened is something you definitely do not want at your Halloween party.", "Blackout"]]]];document.getElementById("gc").textContent=ROOM;let st={scores:[0,0],team:0,used:{},current:null,showAnswer:false,final:null},names=["Team Ghosts","Team Pumpkins"];const $=x=>document.getElementById(x),deals={"1-2":1,"4-3":1};
let saveQueue=Promise.resolve(),revision=0;
function save(){names=[$("n0").value,$("n1").value];const snapshot=JSON.parse(JSON.stringify({state:st,names,updatedAt:Date.now(),revision:++revision}));saveQueue=saveQueue.catch(()=>{}).then(()=>req(PATH,"PATCH",snapshot)).then(()=>{$("sync").textContent="TV synchronized ✓"}).catch(()=>{$("sync").textContent="Connection lost — retrying latest state"});return saveQueue}
setInterval(save,5000);
function render(){for(let i=0;i<2;i++){$("s"+i).textContent=st.scores[i];$("t"+i).classList.toggle("active",st.team===i)}let b=$("board");b.innerHTML="";C.forEach(c=>{let d=document.createElement("div");d.className="cat";d.textContent=c[0];b.appendChild(d)});for(let r=0;r<4;r++)for(let c=0;c<5;c++){let k=c+"-"+r,bt=document.createElement("button");bt.className="clue";bt.textContent="$"+((r+1)*100);bt.disabled=!!st.used[k]||!!st.current||!!st.final;bt.onclick=()=>openClue(c,r);b.appendChild(bt)}if(st.current){let x=st.current.final?FINAL:C[st.current.c][1][st.current.r];$("panel").classList.remove("hidden");$("deal").textContent=st.current.final?"☠️ FINAL FRIGHT — "+names[st.team]:st.current.deal?"😈 DEVIL'S DEAL — Wager $"+st.current.value:"";$("q").textContent=x[0];$("a").textContent=x[1];$("a").classList.toggle("hidden",!st.showAnswer)}else $("panel").classList.add("hidden");$("result").textContent=st.final?.done?(st.scores[0]===st.scores[1]?"☠️ Final Fright ends in a tie!":"🎉 "+names[st.scores[0]>st.scores[1]?0:1]+" wins Final Fright!"):""}
function openClue(c,r){const k=c+"-"+r;if(st.current||st.final||st.used[k])return;let value=(r+1)*100;if(deals[k]){const cap=Math.max(400,st.scores[st.team]);const raw=prompt("Devil's Deal: wager from $0 to $"+cap,String(value));if(raw===null)return;value=Number(raw);if(!raw.trim()||!Number.isInteger(value)||value<0||value>cap)return alert("Enter a whole-dollar wager within the limit.")}st.used[k]=true;st.current={c,r,value,deal:!!deals[k],attempted:[]};st.showAnswer=false;render();save()}function reveal(){if(!st.current)return;st.showAnswer=true;render();save()}function correct(){if(!st.current)return;if(st.current.final)return judgeFinal(true);if(st.current.attempted.includes(st.team))return;st.scores[st.team]+=st.current.value;st.current=null;st.showAnswer=false;st.team=1-st.team;render();save()}function wrong(){if(!st.current)return;if(st.current.final)return judgeFinal(false);if(st.current.attempted.includes(st.team))return;st.scores[st.team]-=st.current.value;st.current.attempted.push(st.team);if(st.current.deal||st.current.attempted.length===2){st.current=null;st.showAnswer=false}st.team=1-st.team;render();save()}function closeClue(){if(st.current?.final)return alert("Judge both teams before returning to the board.");st.current=null;st.showAnswer=false;render();save()}function switchTeam(){if(st.current?.final)return;st.team=1-st.team;render();save()}const FINAL=["This 1975 cult musical horror comedy features Dr. Frank-N-Furter.","The Rocky Horror Picture Show"];
function finalFright(){if(st.current||st.final)return;const wagers=[];for(let i=0;i<2;i++){const cap=Math.max(0,st.scores[i]);const raw=prompt("Final Fright — Til Death Do Us Party\n"+names[i]+": wager $0 to $"+cap,"0");if(raw===null)return;const w=Number(raw);if(!raw.trim()||!Number.isInteger(w)||w<0||w>cap)return alert("Enter a whole-dollar wager within the limit.");wagers.push(w)}st.final={wagers,judged:[],done:false};st.team=0;st.current={final:true,value:wagers[0]};st.showAnswer=false;render();save()}
function judgeFinal(won){if(!st.final||st.final.done||st.final.judged.includes(st.team))return;st.scores[st.team]+=(won?1:-1)*st.final.wagers[st.team];st.final.judged.push(st.team);if(st.final.judged.length===2){st.final.done=true;st.current=null;st.showAnswer=false}else{st.team=1;st.current.value=st.final.wagers[1]}render();save()}
function resetGame(){if(confirm("Start a new game?")){st={scores:[0,0],team:0,used:{},current:null,showAnswer:false,final:null};render();save()}}["n0","n1"].forEach(x=>$(x).onchange=save);render();save();
</script></body></html>
