<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halloween Jeopardy</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#140d20;color:#fff5e9;font-family:system-ui}main{max-width:1100px;margin:auto}h1,h2,p{text-align:center}h1{color:#ff9a3c}.code{text-align:center;color:#ffbf69;font-size:1.35rem;font-weight:900}.scores{display:flex;gap:12px}.team{flex:1;padding:12px;border:2px solid #64477c;border-radius:16px;text-align:center;background:#251737}.team.active{border-color:#ff9a3c}.score{font-size:2.5rem;font-weight:900}button{padding:11px 14px;border:0;border-radius:10px;background:#ff9a3c;color:#241329;font-weight:800;margin:4px}.controls{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:12px}.joinbox{text-align:center;background:#251737;border:2px solid #64477c;border-radius:16px;padding:10px;margin:12px auto}.joinbox img{width:150px;height:150px;background:white;padding:5px}.winner{font-size:1.4rem;color:#83d4b7;font-weight:900;text-align:center}.red{background:#ff6464}button:disabled{opacity:.4}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:14px 0}.cat,.clue{text-align:center;border-radius:8px;padding:8px 4px;font-weight:900}.cat{background:#392451;min-height:65px}.clue{background:#ff9a3c;color:#241329;border:0;font-size:1.3rem;min-height:60px}.clue:disabled{background:#33283a;color:#786b80}.panel{background:#251737;border:2px solid #64477c;border-radius:18px;padding:18px;text-align:center}.hidden{display:none}.answer{color:#83d4b7;font-size:1.4rem;font-weight:900}input{width:100%;background:transparent;color:white;border:0;text-align:center;font-size:1.15rem}@media (max-height:950px){
body{padding:6px}h1{font-size:1.45rem;margin:3px}.code{font-size:1rem}.joinbox{padding:4px;margin:5px auto}.joinbox img{width:88px;height:88px}.joinbox #guestlink{font-size:.72rem;overflow-wrap:anywhere}.controls{margin:5px}.scores{gap:5px}.team{padding:5px}.score{font-size:1.7rem}.board{gap:3px;margin:6px 0}.cat{min-height:42px;padding:4px 2px;font-size:.78rem}.clue{min-height:40px;padding:4px 2px;font-size:1rem}.panel{padding:8px}.panel h2{font-size:1.15rem;margin:4px}
}</style></head><body><main><h1>💀 Halloween Jeopardy <small style="font-size:.38em;color:#83d4b7;vertical-align:middle">V3</small></h1><div class="code">GAME CODE: <span id="gc"></span></div><div class="joinbox"><b>📱 Guests: scan to buzz</b><br><img id="qr"><div id="guestlink"></div></div><div class="controls"><button onclick="home()">🏠 Home</button><button onclick="resetBuzz()">🚨 RESET BUZZERS</button></div><div id="buzzwin" class="winner"></div><div class="scores"><div id="t0" class="team"><input id="n0" value="Team Ghosts"><div id="s0" class="score">0</div></div><div id="t1" class="team"><input id="n1" value="Team Pumpkins"><div id="s1" class="score">0</div></div></div><div id="board" class="board"></div><section id="panel" class="panel hidden"><div id="deal"></div><h2 id="q"></h2><p id="a" class="answer hidden"></p><div class="controls"><button onclick="reveal()">Reveal Answer</button><button onclick="correct()">✓ Correct</button><button onclick="wrong()">✕ Wrong</button><button onclick="closeClue()">Back to Board</button></div></section><div class="controls"><button onclick="switchTeam()">Switch Team</button><button onclick="finalFright()">☠️ Final Fright</button><button onclick="resetGame()">New Game</button></div><p id="result"></p></main><script>
const DB="https://halloween-fued-default-rtdb.firebaseio.com";
const clean=v=>String(v||"").replace(/\D/g,"").slice(0,4);
const code=()=>String(Math.floor(1000+Math.random()*9000));
async function req(path,method="GET",body,headers={}){
 const r=await fetch(DB+"/"+path+".json",{method,headers:{"Content-Type":"application/json",...headers},
 body:body===undefined?undefined:JSON.stringify(body),cache:"no-store"});
 if(!r.ok) throw Error("Firebase "+r.status);
 return r.json();
}
function hostCode(game){
 const qp=clean(new URLSearchParams(location.search).get("room"));
 let k="sanders:"+game+":host",c=qp||clean(sessionStorage.getItem(k));
 if(c.length!==4)c=code(); sessionStorage.setItem(k,c); return c;
}
function home(){location.href="../"}
function guestUrl(game,room){return location.origin+"/guest.html?game="+encodeURIComponent(game)+"&room="+room}
function qrUrl(game,room){return "https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data="+encodeURIComponent(guestUrl(game,room))}

const ROOM=hostCode("jeopardy"),PATH="games/jeopardy/"+ROOM,C=[["🎬 SCARY MOVIES", [["In Hocus Pocus, what kind of women are the Sanderson sisters?", "Witches"], ["What masked killer stalks his victims in the Halloween movies?", "Michael Myers"], ["In Beetlejuice, say his name this many times and he appears.", "Three"], ["What hotel is the setting for The Shining?", "The Overlook Hotel"]]], ["🍸 BOOS & BOOZE", [["This spirit is the main alcohol in a classic margarita.", "Tequila"], ["A Bloody Mary is traditionally made with this liquor.", "Vodka"], ["This cinnamon-flavored whiskey is practically made for a Halloween shot.", "Fireball"], ["A traditional Dark ’n’ Stormy combines ginger beer with this spirit.", "Dark rum"]]], ["🧛 MONSTERS & MAYHEM", [["According to legend, this creature transforms during a full moon.", "Werewolf"], ["This is the one thing Dracula definitely does not want on his garlic bread.", "Garlic"], ["Frankenstein is actually the name of this person, not the monster.", "Victor Frankenstein / the doctor"], ["In Greek mythology, Medusa had these instead of hair.", "Snakes"]]], ["🎃 HALLOWEEN STUFF", [["What vegetable do Americans traditionally carve into jack-o’-lanterns?", "Pumpkin"], ["What two colors are most associated with Halloween?", "Orange and black"], ["Before pumpkins became popular, jack-o’-lanterns in Ireland were commonly carved from this root vegetable.", "Turnips"], ["Halloween traces much of its tradition to this ancient Celtic festival.", "Samhain"]]], ["😈 NAUGHTY OR FRIGHT", [["Complete the pickup line: “Are you a ghost? Because you’ve been _____ me all night.”", "Haunting"], ["This classic costume only needs ears, a tail, and maybe a little black dress.", "A cat / black cat"], ["If someone goes upstairs at the Halloween party to “look at the costumes,” everyone assumes they are probably doing this instead.", "Making out / hooking up"], ["This term for waking up after a wild night with little or no memory of what happened is something you definitely do not want at your Halloween party.", "Blackout"]]]],FINAL=["This 1975 cult musical horror comedy features Dr. Frank-N-Furter.","The Rocky Horror Picture Show"],deals={"1-2":1,"4-3":1};const $=x=>document.getElementById(x);$("gc").textContent=ROOM;$("qr").src=qrUrl("jeopardy",ROOM);$("guestlink").textContent=guestUrl("jeopardy",ROOM);let st={scores:[0,0],team:0,used:{},current:null,showAnswer:false,final:null},names=["Team Ghosts","Team Pumpkins"],revision=0,q=Promise.resolve();
function save(){names=[$("n0").value,$("n1").value];q=q.catch(()=>{}).then(()=>req(PATH,"PATCH",{state:st,names,updatedAt:Date.now(),revision:++revision}));return q}
function render(){for(let i=0;i<2;i++){$("s"+i).textContent=st.scores[i];$("t"+i).classList.toggle("active",st.team===i)}let b=$("board");b.innerHTML="";C.forEach(c=>{let d=document.createElement("div");d.className="cat";d.textContent=c[0];b.appendChild(d)});for(let r=0;r<4;r++)for(let c=0;c<5;c++){let k=c+"-"+r,bt=document.createElement("button");bt.className="clue";bt.textContent="$"+((r+1)*100);bt.disabled=!!st.used[k]||!!st.current||!!st.final;bt.onclick=()=>openClue(c,r);b.appendChild(bt)}if(st.current){let x=st.current.final?FINAL:C[st.current.c][1][st.current.r];$("panel").classList.remove("hidden");$("deal").textContent=st.current.final?"☠️ FINAL FRIGHT — "+names[st.team]:st.current.deal?"😈 DEVIL'S DEAL — Wager $"+st.current.value:"";$("q").textContent=x[0];$("a").textContent=x[1];$("a").classList.toggle("hidden",!st.showAnswer)}else $("panel").classList.add("hidden");$("result").textContent=st.final?.done?(st.scores[0]===st.scores[1]?"☠️ Final Fright ends in a tie!":"🎉 "+names[st.scores[0]>st.scores[1]?0:1]+" wins Final Fright!"):""}
function openClue(c,r){const k=c+"-"+r;if(st.current||st.final||st.used[k])return;let value=(r+1)*100;if(deals[k]){const cap=Math.max(400,st.scores[st.team]),raw=prompt("Devil's Deal: wager from $0 to $"+cap,String(value));if(raw===null)return;value=Number(raw);if(!Number.isInteger(value)||value<0||value>cap)return alert("Enter a whole-dollar wager within the limit.")}st.used[k]=true;st.current={c,r,value,deal:!!deals[k],attempted:[]};st.showAnswer=false;render();save();resetBuzz()}
function reveal(){if(st.current){st.showAnswer=true;render();save()}}function correct(){if(!st.current)return;if(st.current.final)return judgeFinal(true);st.scores[st.team]+=st.current.value;st.current=null;st.showAnswer=false;render();save();resetBuzz()}function wrong(){if(!st.current)return;if(st.current.final)return judgeFinal(false);st.scores[st.team]-=st.current.value;st.current.attempted.push(st.team);if(st.current.deal||st.current.attempted.length===2){st.current=null;st.showAnswer=false}st.team=1-st.team;render();save();resetBuzz()}function closeClue(){if(st.current?.final)return;st.current=null;st.showAnswer=false;render();save()}function switchTeam(){st.team=1-st.team;render();save()}
function finalFright(){if(st.current||st.final)return;let wagers=[];for(let i=0;i<2;i++){let cap=Math.max(0,st.scores[i]),raw=prompt("Final Fright — "+names[i]+": wager $0 to $"+cap,"0");if(raw===null)return;let w=Number(raw);if(!Number.isInteger(w)||w<0||w>cap)return alert("Invalid wager");wagers.push(w)}st.final={wagers,judged:[],done:false};st.team=0;st.current={final:true,value:wagers[0]};render();save()}function judgeFinal(won){st.scores[st.team]+=(won?1:-1)*st.final.wagers[st.team];st.final.judged.push(st.team);if(st.final.judged.length===2){st.final.done=true;st.current=null}else{st.team=1;st.current.value=st.final.wagers[1]}render();save()}function resetGame(){if(confirm("Start a new game?")){st={scores:[0,0],team:0,used:{},current:null,showAnswer:false,final:null};render();save();resetBuzz()}}
async function resetBuzz(){
 await req(PATH+"/phone/buzz","DELETE");
 await req(PATH+"/phone","PATCH",{resetId:Date.now(),buzzEnabled:true,spinEnabled:false});
 $("buzzwin").textContent="";
}
let seenBuzz="";
async function phonePoll(){
 try{
  const p=await req(PATH+"/phone");
  if(p?.buzz){
   $("buzzwin").textContent=p.buzz.team===0?"👻 TEAM GHOSTS BUZZED FIRST!":"🎃 TEAM PUMPKINS BUZZED FIRST!";
   const id=String(p.buzz.id||p.buzz.at||p.buzz.team);
   if(id!==seenBuzz){
    seenBuzz=id;
    st.team=Number(p.buzz.team)===1?1:0;
    render();
    await save();
   }
  }else{
   $("buzzwin").textContent="";
  }
 }catch(e){
  console.error(e);
 }finally{
  setTimeout(phonePoll,500);
 }
}
["n0","n1"].forEach(x=>$(x).onchange=save);render();save();resetBuzz();phonePoll();setInterval(save,5000);
</script></body></html>
