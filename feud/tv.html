<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halloween Feud TV</title><style>
*{box-sizing:border-box}body{margin:0;padding:14px;background:#140d20;color:#fff5e9;font-family:system-ui}main{max-width:1500px;margin:auto}h1,h2,p{text-align:center}h1{color:#ff9a3c}.scores{display:flex;gap:18px}.team{flex:1;padding:12px;border:3px solid #64477c;border-radius:18px;text-align:center;background:#251737}.team.active{border-color:#ff9a3c}.score{font-size:3rem;font-weight:900}#board{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{display:flex;justify-content:space-between;padding:16px;background:#392451;border-radius:12px;font-size:1.5rem;font-weight:800}.on{background:#235246}#timer{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:10rem;font-weight:900;background:#140d20cc;z-index:9000}#join{position:fixed;inset:0;z-index:99999;background:#140d20;display:flex;align-items:center;justify-content:center}#join .joincard{width:min(560px,92vw);padding:28px;text-align:center;background:#251737;border:3px solid #ff9a3c;border-radius:22px}#join input{font-size:2.3rem;width:190px;text-align:center;letter-spacing:.28em;padding:10px;border-radius:12px}button{cursor:pointer}</style></head><body>
<div id="join"><div class="joincard"><h1>🎃 Halloween Feud</h1><h2>📺 Join Game</h2><p>Enter the 4-digit Game Code shown on the host tablet.</p>
<input id="jc" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="1234"><br>
<button onclick="joinGame()">JOIN GAME</button><button onclick="home()">🏠 Game Night Home</button></div></div>
<div id="timer"></div><audio id="music" src="spooky-halloween.mp3"></audio><audio id="scream" src="scary-scream.mp3"></audio><main><h1>🎃 Halloween Feud</h1><div class="scores"><div id="t0" class="team"><b id="n0"></b><div id="s0" class="score"></div></div><div id="t1" class="team"><b id="n1"></b><div id="s1" class="score"></div></div></div><p id="round"></p><h2 id="question"></h2><p id="status"></p><p id="bank"></p><p id="strikes"></p><p id="sync" role="status"></p><button onclick="enableSound()">🔊 Enable TV Sound</button><div id="board"></div></main><script>
const DB="https://halloween-fued-default-rtdb.firebaseio.com";
const code=()=>String(Math.floor(1000+Math.random()*9000));
const clean=v=>String(v||"").replace(/\D/g,"").slice(0,4);
async function req(path,method="GET",body){
 const r=await fetch(DB+"/"+path+".json",{method,headers:{"Content-Type":"application/json"},body:body===undefined?undefined:JSON.stringify(body),cache:"no-store"});
 if(!r.ok)throw Error("Firebase "+r.status); return r.json();
}
function hostCode(game){let k="sanders:"+game+":host",c=clean(sessionStorage.getItem(k));if(c.length!==4){c=code();sessionStorage.setItem(k,c)}return c}
function home(){location.href="../"}

const Q=[{"question": "Name something that gets scarier the older you get.", "answers": [["Getting older / birthdays", 28], ["Bills / money", 22], ["Doctors / health", 18], ["The mirror", 14], ["Hangovers", 10], ["Teenagers / kids", 8]]}, {"question": "Name something you might regret doing at a Halloween party.", "answers": [["Drinking too much", 30], ["Texting an ex", 20], ["Bad dancing", 16], ["Kissing someone", 14], ["Posting pictures", 12], ["Wearing THAT costume", 8]]}, {"question": "Name something people think they're really good at after a few drinks.", "answers": [["Dancing", 28], ["Singing", 22], ["Flirting", 18], ["Telling stories", 14], ["Giving advice", 10], ["Texting", 8]]}, {"question": "Name something embarrassing that could happen while wearing a Halloween costume.", "answers": [["Costume rips", 26], ["Trip / fall", 22], ["Wardrobe malfunction", 18], ["Can't use the bathroom", 14], ["Lose part of the costume", 12], ["Someone wears the same costume", 8]]}, {"question": "Name a costume you'd question if your spouse said, 'Don't worry, it's totally appropriate.'", "answers": [["Sexy nurse", 24], ["Playboy bunny", 20], ["Stripper", 18], ["French maid", 16], ["Tarzan / Jane", 12], ["Anything with body paint", 10]]}, {"question": "Name something you might hear yelled at an adult Halloween party.", "answers": [["Shots!", 28], ["Turn it up!", 20], ["Where's my drink?", 18], ["Take a picture!", 14], ["Who invited them?", 12], ["I need an Uber!", 8]]}, {"question": "Besides candy, name something adults hope to get on Halloween night.", "answers": [["Drinks", 26], ["Get lucky", 22], ["A kiss", 18], ["Attention", 14], ["Food", 12], ["A phone number", 8]]}, {"question": "Name something that could make you say, 'I'm NEVER drinking that again!'", "answers": [["Tequila", 28], ["Fireball", 22], ["Mystery punch", 18], ["Shots", 14], ["Too much wine", 10], ["Jell-O shots", 8]]}];const $=x=>document.getElementById(x);let PATH="",lastTimer=0,generation=0,timerInterval=null,timerHide=null;
function render(v){let st=v.state,n=v.names||["Team Ghosts","Team Pumpkins"],a=st.phase==="settled"?st.winner:st.phase==="steal"?1-st.controller:st.controller,q=Q[st.round];for(let i=0;i<2;i++){$("n"+i).textContent=n[i];$("s"+i).textContent=st.scores[i];$("t"+i).classList.toggle("active",a===i)}$("round").textContent=`Round ${st.round+1} of ${Q.length}`;$("question").textContent=q.question;$("status").textContent=st.phase==="steal"?n[a]+": one guess to steal!":st.phase==="settled"?n[st.winner]+" wins "+st.bank+" points!":n[a]+" is playing.";$("bank").textContent="Round points: "+st.bank;$("strikes").textContent="❌ ".repeat(st.strikes||0);let b=$("board");b.innerHTML="";q.answers.forEach((x,i)=>{let d=document.createElement("div");d.className="answer"+((st.revealed||[]).includes(i)?" on":"");d.innerHTML=(st.revealed||[]).includes(i)?`<span>${x[0]}</span><b>${x[1]}</b>`:`<span>Answer ${i+1}</span><b>🎃</b>`;b.appendChild(d)})}

function safePlay(a){const p=a.play();if(p&&p.catch)p.catch(()=>{$("sync").textContent="Sound blocked — use Enable TV Sound"})}
function enableSound(){for(const id of ["music","scream"]){const a=$(id);a.volume=.01;const p=a.play();if(p&&p.then)p.then(()=>{a.pause();a.currentTime=0;a.volume=1}).catch(()=>{})}}
function stopTimer(){clearInterval(timerInterval);clearTimeout(timerHide);timerInterval=null;$("music").pause();$("scream").pause();$("timer").style.display="none"}
function runTimer(end){stopTimer();const m=$("music");m.currentTime=0;safePlay(m);const tick=()=>{const left=Math.max(0,Math.ceil((end-Date.now())/1000));$("timer").style.display="flex";$("timer").textContent=left||"TIME!";if(!left){clearInterval(timerInterval);m.pause();$("scream").currentTime=0;safePlay($("scream"));timerHide=setTimeout(()=>{$("timer").style.display="none"},3000)}};timerInterval=setInterval(tick,150);tick()}
async function poll(token){try{const v=await req(PATH);if(token!==generation)return;if(v&&v.state){render(v);$("sync").textContent="";const t=v.state.timer||v.timer;if(!t||t.status!=="running"){stopTimer();lastTimer=t?.commandId||0}else if(t.commandId!==lastTimer){lastTimer=t.commandId;if(t.endsAt>Date.now())runTimer(t.endsAt);else stopTimer()}}else $("sync").textContent="Waiting for host…"}catch(e){if(token===generation)$("sync").textContent="Connection lost — reconnecting…"}finally{if(token===generation)setTimeout(()=>poll(token),700)}}
function joinGame(){const c=clean($("jc").value);if(c.length!==4)return alert("Enter all 4 numbers.");enableSound();stopTimer();lastTimer=0;PATH="games/"+c;$("join").style.display="none";poll(++generation)}
$("jc").addEventListener("keydown",e=>{if(e.key==="Enter")joinGame()});
</script></body></html>
