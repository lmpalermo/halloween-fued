<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halloween Feud TV</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#140d20;color:#fff5e9;font-family:system-ui}main{max-width:1100px;margin:auto}h1,h2,p{text-align:center}h1{color:#ff9a3c}.code{text-align:center;color:#ffbf69;font-size:1.35rem;font-weight:900}.scores{display:flex;gap:12px}.team{flex:1;padding:12px;border:2px solid #64477c;border-radius:16px;text-align:center;background:#251737}.team.active{border-color:#ff9a3c}.score{font-size:2.5rem;font-weight:900}button{padding:11px 14px;border:0;border-radius:10px;background:#ff9a3c;color:#241329;font-weight:800;margin:4px}.controls{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:12px}.joinbox{text-align:center;background:#251737;border:2px solid #64477c;border-radius:16px;padding:10px;margin:12px auto}.joinbox img{width:150px;height:150px;background:white;padding:5px}.winner{font-size:1.4rem;color:#83d4b7;font-weight:900;text-align:center}.red{background:#ff6464}button:disabled{opacity:.4}#board{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{display:flex;justify-content:space-between;padding:16px;background:#392451;border-radius:12px;font-size:1.5rem;font-weight:800}.on{background:#235246}#join{position:fixed;inset:0;background:#140d20;display:flex;align-items:center;justify-content:center;z-index:99}#join input{font-size:2rem;width:180px;text-align:center}#timer{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:10rem;background:#140d20dd;z-index:90}#buzzwin{font-size:2.3rem}</style></head><body><div id="join"><div><h1>🎃 Halloween Feud TV</h1><input id="jc" maxlength="4" inputmode="numeric"><button onclick="joinGame()">JOIN</button></div></div><div id="timer"></div><audio id="music" src="spooky-halloween.mp3"></audio><audio id="scream" src="scary-scream.mp3"></audio><main><h1>🎃 Halloween Feud</h1><div id="buzzwin" class="winner"></div><div class="scores"><div id="t0" class="team"><b id="n0"></b><div id="s0" class="score"></div></div><div id="t1" class="team"><b id="n1"></b><div id="s1" class="score"></div></div></div><p id="round"></p><h2 id="question"></h2><p id="status"></p><p id="bank"></p><p id="strikes"></p><button onclick="enableSound()">🔊 Enable TV Sound</button><div id="board"></div></main><script>
const DB="https://halloween-fued-default-rtdb.firebaseio.com";
const clean=v=>String(v||"").replace(/\D/g,"").slice(0,4);
const code=()=>String(Math.floor(1000+Math.random()*9000));
async function req(path,method="GET",body,headers={}){
 const r=await fetch(DB+"/"+path+".json",{method,headers:{"Content-Type":"application/json",...headers},
 body:body===undefined?undefined:JSON.stringify(body),cache:"no-store"});
 if(!r.ok) throw Error("Firebase "+r.status);
 return r.json();
}
function hostCode(game){
 const qp=clean(new URLSearchParams(location.search).get("room"));
 let k="sanders:"+game+":host",c=qp||clean(sessionStorage.getItem(k));
 if(c.length!==4)c=code(); sessionStorage.setItem(k,c); return c;
}
function home(){location.href="../"}
function guestUrl(game,room){return location.origin+"/guest.html?game="+encodeURIComponent(game)+"&room="+room}
function qrUrl(game,room){return "https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data="+encodeURIComponent(guestUrl(game,room))}

const Q=[{"question": "Name something that gets scarier the older you get.", "answers": [["Getting older / birthdays", 28], ["Bills / money", 22], ["Doctors / health", 18], ["The mirror", 14], ["Hangovers", 10], ["Teenagers / kids", 8]]}, {"question": "Name something you might regret doing at a Halloween party.", "answers": [["Drinking too much", 30], ["Texting an ex", 20], ["Bad dancing", 16], ["Kissing someone", 14], ["Posting pictures", 12], ["Wearing THAT costume", 8]]}, {"question": "Name something people think they're really good at after a few drinks.", "answers": [["Dancing", 28], ["Singing", 22], ["Flirting", 18], ["Telling stories", 14], ["Giving advice", 10], ["Texting", 8]]}, {"question": "Name something embarrassing that could happen while wearing a Halloween costume.", "answers": [["Costume rips", 26], ["Trip / fall", 22], ["Wardrobe malfunction", 18], ["Can't use the bathroom", 14], ["Lose part of the costume", 12], ["Someone wears the same costume", 8]]}, {"question": "Name a costume you'd question if your spouse said, 'Don't worry, it's totally appropriate.'", "answers": [["Sexy nurse", 24], ["Playboy bunny", 20], ["Stripper", 18], ["French maid", 16], ["Tarzan / Jane", 12], ["Anything with body paint", 10]]}, {"question": "Name something you might hear yelled at an adult Halloween party.", "answers": [["Shots!", 28], ["Turn it up!", 20], ["Where's my drink?", 18], ["Take a picture!", 14], ["Who invited them?", 12], ["I need an Uber!", 8]]}, {"question": "Besides candy, name something adults hope to get on Halloween night.", "answers": [["Drinks", 26], ["Get lucky", 22], ["A kiss", 18], ["Attention", 14], ["Food", 12], ["A phone number", 8]]}, {"question": "Name something that could make you say, 'I'm NEVER drinking that again!'", "answers": [["Tequila", 28], ["Fireball", 22], ["Mystery punch", 18], ["Shots", 14], ["Too much wine", 10], ["Jell-O shots", 8]]}];const $=x=>document.getElementById(x);let PATH="",gen=0,lastTimer=0,ti=null,hide=null;
function render(v){let st=v.state,n=v.names||["Team Ghosts","Team Pumpkins"],a=st.phase==="settled"?st.winner:st.phase==="steal"?1-st.controller:st.controller,q=Q[st.round];for(let i=0;i<2;i++){$("n"+i).textContent=n[i];$("s"+i).textContent=st.scores[i];$("t"+i).classList.toggle("active",a===i)}$("round").textContent=`Round ${st.round+1} of ${Q.length}`;$("question").textContent=q.question;$("status").textContent=st.phase==="steal"?n[a]+": one guess to steal!":st.phase==="settled"?n[st.winner]+" wins "+st.bank+" points!":n[a]+" is playing.";$("bank").textContent="Round points: "+st.bank;$("strikes").textContent="❌ ".repeat(st.strikes||0);$("buzzwin").textContent=v.phone?.buzz?(v.phone.buzz.team===0?"👻 TEAM GHOSTS BUZZED FIRST!":"🎃 TEAM PUMPKINS BUZZED FIRST!"):"";let b=$("board");b.innerHTML="";q.answers.forEach((x,i)=>{let d=document.createElement("div");d.className="answer"+((st.revealed||[]).includes(i)?" on":"");d.innerHTML=(st.revealed||[]).includes(i)?`<span>${x[0]}</span><b>${x[1]}</b>`:`<span>Answer ${i+1}</span><b>🎃</b>`;b.appendChild(d)})}
function enableSound(){for(const id of ["music","scream"]){const a=$(id);a.volume=.01;a.play().then(()=>{a.pause();a.currentTime=0;a.volume=1}).catch(()=>{})}}
function stopTimer(){clearInterval(ti);clearTimeout(hide);$("music").pause();$("timer").style.display="none"}function runTimer(end){stopTimer();$("music").currentTime=0;$("music").play().catch(()=>{});const tick=()=>{const l=Math.max(0,Math.ceil((end-Date.now())/1000));$("timer").style.display="flex";$("timer").textContent=l||"TIME!";if(!l){clearInterval(ti);$("music").pause();$("scream").currentTime=0;$("scream").play().catch(()=>{});hide=setTimeout(()=>$("timer").style.display="none",3000)}};ti=setInterval(tick,150);tick()}
async function poll(t){try{const v=await req(PATH);if(t!==gen)return;if(v?.state){render(v);const z=v.state.timer;if(!z||z.status!=="running"){stopTimer();lastTimer=z?.commandId||0}else if(z.commandId!==lastTimer){lastTimer=z.commandId;if(z.endsAt>Date.now())runTimer(z.endsAt)}}}finally{if(t===gen)setTimeout(()=>poll(t),650)}}function joinGame(){const c=clean($("jc").value);if(c.length!==4)return alert("Enter 4 digits");enableSound();PATH="games/"+c;$("join").style.display="none";poll(++gen)}$("jc").onkeydown=e=>{if(e.key==="Enter")joinGame()};
</script></body></html>
