<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halloween Feud</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#140d20;color:#fff5e9;font-family:system-ui}main{max-width:1100px;margin:auto}h1,h2,p{text-align:center}h1{color:#ff9a3c}.code{text-align:center;color:#ffbf69;font-size:1.35rem;font-weight:900}.scores{display:flex;gap:12px}.team{flex:1;padding:12px;border:2px solid #64477c;border-radius:16px;text-align:center;background:#251737}.team.active{border-color:#ff9a3c}.score{font-size:2.5rem;font-weight:900}button{padding:11px 14px;border:0;border-radius:10px;background:#ff9a3c;color:#241329;font-weight:800;margin:4px}.controls{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:12px}.joinbox{text-align:center;background:#251737;border:2px solid #64477c;border-radius:16px;padding:10px;margin:12px auto}.joinbox img{width:150px;height:150px;background:white;padding:5px}.winner{font-size:1.4rem;color:#83d4b7;font-weight:900;text-align:center}.red{background:#ff6464}button:disabled{opacity:.4}#board{display:grid;gap:9px}.answer{display:flex;justify-content:space-between;width:100%;padding:14px;background:#392451;color:white;border:1px solid #64477c;border-radius:10px;font-size:1.2rem}.answer.on{background:#235246}input{width:100%;background:transparent;color:white;border:0;text-align:center;font-size:1.15rem}#strikes{color:#ff6464;font-size:2rem}</style></head><body><main><h1>🎃 Halloween Feud</h1><div class="code">GAME CODE: <span id="gc"></span></div><div class="joinbox"><b>📱 Guests: scan to join</b><br><img id="qr"><div id="guestlink"></div></div><div class="controls"><button onclick="home()">🏠 Home</button><button onclick="resetBuzz()">🚨 RESET BUZZERS</button></div><div id="buzzwin" class="winner"></div>
<div class="scores"><div id="t0" class="team"><input id="n0" value="Team Ghosts"><div id="s0" class="score">0</div></div><div id="t1" class="team"><input id="n1" value="Team Pumpkins"><div id="s1" class="score">0</div></div></div><p id="round"></p><h2 id="question"></h2><p>Round points: <b id="bank">0</b></p><p id="strikes"></p><p id="status"></p><div id="board"></div><div class="controls"><button onclick="sw()">Switch Team</button><button class="red" onclick="strike()">❌ Strike</button><button onclick="award()">Award Round</button><button onclick="failed()">Steal Failed</button><button onclick="next()">Next Round ➜</button><button onclick="timer()">🎵 15-Second Timer</button><button onclick="resetGame()">New Game</button></div><p id="sync"></p></main><script>
const DB="https://halloween-fued-default-rtdb.firebaseio.com";
const clean=v=>String(v||"").replace(/\D/g,"").slice(0,4);
const code=()=>String(Math.floor(1000+Math.random()*9000));
async function req(path,method="GET",body,headers={}){
 const r=await fetch(DB+"/"+path+".json",{method,headers:{"Content-Type":"application/json",...headers},
 body:body===undefined?undefined:JSON.stringify(body),cache:"no-store"});
 if(!r.ok) throw Error("Firebase "+r.status);
 return r.json();
}
function hostCode(game){
 const qp=clean(new URLSearchParams(location.search).get("room"));
 let k="sanders:"+game+":host",c=qp||clean(sessionStorage.getItem(k));
 if(c.length!==4)c=code(); sessionStorage.setItem(k,c); return c;
}
function home(){location.href="../"}
function guestUrl(game,room){return location.origin+"/guest.html?game="+encodeURIComponent(game)+"&room="+room}
function qrUrl(game,room){return "https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data="+encodeURIComponent(guestUrl(game,room))}

const ROOM=hostCode("feud"),PATH="games/"+ROOM,Q=[{"question": "Name something that gets scarier the older you get.", "answers": [["Getting older / birthdays", 28], ["Bills / money", 22], ["Doctors / health", 18], ["The mirror", 14], ["Hangovers", 10], ["Teenagers / kids", 8]]}, {"question": "Name something you might regret doing at a Halloween party.", "answers": [["Drinking too much", 30], ["Texting an ex", 20], ["Bad dancing", 16], ["Kissing someone", 14], ["Posting pictures", 12], ["Wearing THAT costume", 8]]}, {"question": "Name something people think they're really good at after a few drinks.", "answers": [["Dancing", 28], ["Singing", 22], ["Flirting", 18], ["Telling stories", 14], ["Giving advice", 10], ["Texting", 8]]}, {"question": "Name something embarrassing that could happen while wearing a Halloween costume.", "answers": [["Costume rips", 26], ["Trip / fall", 22], ["Wardrobe malfunction", 18], ["Can't use the bathroom", 14], ["Lose part of the costume", 12], ["Someone wears the same costume", 8]]}, {"question": "Name a costume you'd question if your spouse said, 'Don't worry, it's totally appropriate.'", "answers": [["Sexy nurse", 24], ["Playboy bunny", 20], ["Stripper", 18], ["French maid", 16], ["Tarzan / Jane", 12], ["Anything with body paint", 10]]}, {"question": "Name something you might hear yelled at an adult Halloween party.", "answers": [["Shots!", 28], ["Turn it up!", 20], ["Where's my drink?", 18], ["Take a picture!", 14], ["Who invited them?", 12], ["I need an Uber!", 8]]}, {"question": "Besides candy, name something adults hope to get on Halloween night.", "answers": [["Drinks", 26], ["Get lucky", 22], ["A kiss", 18], ["Attention", 14], ["Food", 12], ["A phone number", 8]]}, {"question": "Name something that could make you say, 'I'm NEVER drinking that again!'", "answers": [["Tequila", 28], ["Fireball", 22], ["Mystery punch", 18], ["Shots", 14], ["Too much wine", 10], ["Jell-O shots", 8]]}];document.getElementById("gc").textContent=ROOM;document.getElementById("qr").src=qrUrl("feud",ROOM);document.getElementById("guestlink").textContent=guestUrl("feud",ROOM);
let st={round:0,scores:[0,0],controller:0,strikes:0,revealed:[],bank:0,phase:"play",winner:null},names=["Team Ghosts","Team Pumpkins"],revision=0,saveQueue=Promise.resolve();const $=x=>document.getElementById(x);function active(){return st.phase==="settled"?st.winner:st.phase==="steal"?1-st.controller:st.controller}
function save(){names=[$("n0").value,$("n1").value];const snap={state:st,names,updatedAt:Date.now(),revision:++revision};saveQueue=saveQueue.catch(()=>{}).then(()=>req(PATH,"PATCH",snap));return saveQueue}
function render(){let q=Q[st.round];for(let i=0;i<2;i++){$("s"+i).textContent=st.scores[i];$("t"+i).classList.toggle("active",active()===i)}$("round").textContent=`Round ${st.round+1} of ${Q.length}`;$("question").textContent=q.question;$("bank").textContent=st.bank;$("strikes").textContent="❌ ".repeat(st.strikes);$("status").textContent=st.phase==="steal"?names[active()]+": one guess to steal!":st.phase==="settled"?names[st.winner]+" wins the round!":names[active()]+" is playing.";let b=$("board");b.innerHTML="";q.answers.forEach((a,i)=>{let bt=document.createElement("button");bt.className="answer"+(st.revealed.includes(i)?" on":"");bt.innerHTML=st.revealed.includes(i)?`<span>${a[0]}</span><b>${a[1]}</b>`:`<span>Answer ${i+1}</span><b>🎃</b>`;bt.disabled=st.phase==="settled"||st.revealed.includes(i);bt.onclick=()=>reveal(i);b.appendChild(bt)})}
function reveal(i){if(st.revealed.includes(i)||st.phase==="settled")return;st.revealed.push(i);st.bank+=Q[st.round].answers[i][1];if(st.phase==="steal")settle(1-st.controller);render();save()}function settle(w){if(st.phase==="settled")return;st.scores[w]+=st.bank;st.winner=w;st.phase="settled";stopTimer()}
function sw(){if(st.phase!=="play")return;st.controller=1-st.controller;render();save()}function strike(){if(st.phase!=="play")return;st.strikes++;if(st.strikes>=3)st.phase="steal";render();save()}function award(){if(st.phase!=="settled"){settle(active());render();save()}}function failed(){if(st.phase==="steal"){settle(st.controller);render();save()}}function next(){if(st.round>=Q.length-1)return;stopTimer();st.round++;st.controller=st.round%2;st.strikes=0;st.revealed=[];st.bank=0;st.phase="play";st.winner=null;render();save();resetBuzz()}function resetGame(){if(confirm("Start a new game?")){st={round:0,scores:[0,0],controller:0,strikes:0,revealed:[],bank:0,phase:"play",winner:null};stopTimer();render();save();resetBuzz()}}
function timer(){const now=Date.now();st.timer={status:"running",commandId:now,endsAt:now+15000};save()}function stopTimer(){st.timer={status:"stopped",commandId:Date.now(),endsAt:0}}
async function resetBuzz(){await req(PATH+"/phone/buzz","DELETE");await req(PATH+"/phone","PATCH",{resetId:Date.now(),buzzEnabled:true});$("buzzwin").textContent="🚨 Buzzers ready!"}
async function phonePoll(){try{const p=await req(PATH+"/phone");$("buzzwin").textContent=p?.buzz?(p.buzz.team===0?"👻 TEAM GHOSTS BUZZED FIRST!":"🎃 TEAM PUMPKINS BUZZED FIRST!"):""}catch(e){}finally{setTimeout(phonePoll,500)}}
["n0","n1"].forEach(x=>$(x).onchange=save);render();save();resetBuzz();phonePoll();setInterval(save,5000);
</script></body></html>
